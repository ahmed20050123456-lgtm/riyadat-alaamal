<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان المالية العامة التفاعلي</title>
<style>
:root{--bg:#0f1b2d;--card:#162842;--card2:#1c3355;--gold:#ffc83d;--ok:#22c55e;--bad:#ef4444;--tx:#eef3fb;--mut:#9fb3cf;--acc:#38bdf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#0b1424,#12294a 60%,#0f1b2d);color:var(--tx);line-height:1.8;min-height:100vh}
header{text-align:center;padding:34px 16px 22px;background:radial-gradient(circle at 50% 0,#244a7d 0,transparent 70%)}
.smile{font-size:78px;display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
header h1{margin:6px 0 2px;font-size:clamp(24px,5vw,40px);color:var(--gold)}
.designer{font-size:clamp(17px,3.6vw,24px);font-weight:700;margin:4px 0}
.designer span{color:var(--acc)}
.quote{max-width:700px;margin:12px auto 0;padding:12px 18px;background:rgba(255,255,255,.07);border:1px dashed var(--gold);border-radius:14px;font-size:clamp(15px,3.2vw,19px)}
.wink{display:inline-block;animation:w 1.8s infinite}
@keyframes w{0%,80%,100%{transform:scale(1)}90%{transform:scale(1.5) rotate(15deg)}}
.bar{position:sticky;top:0;z-index:10;background:rgba(11,20,36,.95);backdrop-filter:blur(6px);border-bottom:2px solid var(--gold);padding:10px 14px}
.bar-in{max-width:900px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:15px}
.prog{flex:1 1 100%;height:8px;background:#26406a;border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold));transition:width .3s}
.stat b{color:var(--gold)}
.tabs{max-width:900px;margin:18px auto 0;display:flex;gap:8px;padding:0 14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:140px;padding:12px;border:none;border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;border:2px solid transparent;transition:.2s}
.tabs button.on{background:var(--gold);color:#1a1a1a}
.tabs button:hover{border-color:var(--gold)}
main{max-width:900px;margin:16px auto 60px;padding:0 14px}
.sec{display:none}.sec.on{display:block}
.q{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;border:1px solid #28456f;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.q .n{display:inline-block;background:var(--gold);color:#111;border-radius:8px;padding:0 10px;font-weight:800;margin-left:8px}
.q p.t{font-size:18px;font-weight:600;margin:0 0 12px}
.opts{display:grid;gap:9px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{padding:12px 14px;border-radius:12px;background:var(--card2);border:2px solid transparent;color:var(--tx);font:inherit;cursor:pointer;text-align:right;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--acc);transform:translateX(-3px)}
.opt:disabled{cursor:default}
.opt.right{background:rgba(34,197,94,.2);border-color:var(--ok)}
.opt.wrong{background:rgba(239,68,68,.22);border-color:var(--bad)}
.exp{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25);border-right:5px solid var(--acc);font-size:16px}
.exp.show{display:block;animation:f .35s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.exp .v{font-weight:800}
.exp .v.g{color:var(--ok)}.exp .v.r{color:var(--bad)}
textarea{width:100%;min-height:110px;border-radius:12px;border:2px solid #355a8f;background:#0f203a;color:var(--tx);font:inherit;padding:10px;resize:vertical}
.btn{margin-top:10px;padding:10px 18px;border:none;border-radius:10px;background:var(--acc);color:#04202e;font:inherit;font-weight:800;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.model{display:none;margin-top:12px;padding:14px;border-radius:12px;background:rgba(34,197,94,.12);border-right:5px solid var(--ok)}
.model.show{display:block;animation:f .35s}
.model table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.model td,.model th{border:1px solid #3b6aa5;padding:5px 8px;text-align:center}
.model ul{margin:6px 0;padding-right:20px}
.final{display:none;text-align:center;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:24px;margin:20px 0}
.final.show{display:block}
.final .big{font-size:48px;color:var(--gold);font-weight:900}
.tools{text-align:center;margin:10px 0}
.tools .btn{margin:4px}
.btn.red{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:#111}
footer{text-align:center;padding:20px;color:var(--mut);font-size:14px}
@media(max-width:520px){.opts.tf{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="smile">😄</div>
  <h1>امتحان المالية العامة التفاعلي</h1>
  <div class="designer">تصميم: <span>أحمد حسين ابراهيم</span> 😊</div>
  <div class="quote">الحياة يوم ليك ويوم عليك ويوم عليك تاني... اومال مفكر ايه؟ <span class="wink">😉</span></div>
</header>

<div class="bar"><div class="bar-in">
  <div class="stat">تمت الإجابة: <b id="done">0</b> / 100</div>
  <div class="stat">✅ صحيح: <b id="okc">0</b></div>
  <div class="stat">❌ خطأ: <b id="badc">0</b></div>
  <div class="stat">الدرجة: <b id="pct">0%</b></div>
  <div class="prog"><i id="pbar"></i></div>
</div></div>

<div class="tabs">
  <button class="on" data-t="tf">صح وخطأ (50)</button>
  <button data-t="mcq">اختر من متعدد (50)</button>
  <button data-t="essay">مقالي (10)</button>
</div>

<main>
  <section class="sec on" id="tf"></section>
  <section class="sec" id="mcq"></section>
  <section class="sec" id="essay"></section>
  <div class="tools">
    <button class="btn gold" id="finish">🏁 إنهاء وعرض النتيجة</button>
    <button class="btn red" id="reset">🔄 إعادة الامتحان</button>
  </div>
  <div class="final" id="final"></div>
</main>
<footer>تصميم أحمد حسين ابراهيم 😄 — الأسئلة من ملخص المالية العامة (Mohamed El-Sergany)</footer>

<script>
/* ===== صح وخطأ: [العبارة, الإجابة(true/false), الشرح] ===== */
const TF=[
["المالية العامة هي النظام الذي تدرس من خلاله الدولة كيفية تنظيم الإيرادات والنفقات العامة لتحقيق أهدافها الاقتصادية والاجتماعية.",true,"هذا هو تعريف المالية العامة كما ورد في الملخص."],
["من الإيرادات العامة: الضرائب والرسوم والغرامات وأملاك الدولة.",true,"الإيرادات العامة تشمل الضرائب، الرسوم، الضمان الاجتماعي، أملاك الدولة، الغرامات، عوائد الاستثمارات الحكومية والقروض العامة."],
["تسليح الجيش والتعليم والصحة تُعد من الإيرادات العامة.",false,"هذه من النفقات العامة وليست إيرادات."],
["الموازنة العامة للدولة وثيقة تقديرية توضع لسنة مالية واحدة مقبلة.",true,"الموازنة برنامج مالي ووثيقة تقديرية لسنة واحدة مقبلة."],
["الميزانية بيان مالي تقديري يوضع قبل بداية السنة المالية.",false,"الميزانية بيان مالي وحساب فعلي ومحقق يكون في نهاية السنة المالية، أما التقديري فهو الموازنة."],

["الحساب الختامي تقرير مالي رسمي فعلي يُعرض في نهاية السنة المالية ويقارن بالأرقام المقدرة في الموازنة.",true,"هذا هو هدفه ووظيفته كما في الملخص."],
["تنقسم الموازنة العامة إلى ثلاثة عناصر رئيسية: النفقات العامة، الإيرادات العامة، أصول الموازنة العامة.",true,"هذا التقسيم الوارد في الملخص."],
["السنة المالية في مصر تنتهي يوم 31 يونيو.",false,"تنتهي يوم 30 يونيو لأن شهر يونيو 30 يومًا فقط."],
["التبرع الذي يقدمه شخص للدولة لا يُعد نفقة عامة، بل قد يُعد إيرادًا عامًا.",true,"التبرع يدخل خزينة الدولة فيُعد إيرادًا لا نفقة."],
["النفقة العامة مبلغ من النقود تدفعه الدولة أو أحد أشخاص القانون العام لتحقيق غاية عامة أو إشباع حاجة عامة.",true,"هذا تعريف النفقة العامة."],
["تبرع المحافظ براتبه الشخصي يُعد نفقة عامة.",false,"لا يُعد نفقة عامة لأنه مال خاص."],
["تبرع شخص بمليون جنيه للدولة يُعد إيرادًا للدولة عند قبوله.",true,"يُعد إيرادًا عند قبوله، ولا يصبح نفقة عامة إلا إذا أنفقته الدولة لاحقًا للمنفعة العامة."],
["يصبح مبلغ التبرع نفقة عامة بمجرد قبول الدولة له.",false,"لا يصبح نفقة عامة إلا إذا أنفقته الدولة لاحقًا للمنفعة العامة."],
["تبرع الدولة لجهة خاصة يتوقف تكييفه على طبيعة الجهة وغرض الإنفاق ومدى ارتباطه بتحقيق المنفعة العامة وفق القانون.",true,"هذا نص الملخص في المثال الثالث."],
["للنفقة العامة ثلاثة عناصر أساسية.",true,"صدورها من شخص معين، تحقيق المنفعة العامة، ودفع مبلغ من النقود."],
["يجوز أن تكون النفقة العامة عينية بدلًا من أن تكون نقدية.",false,"من عناصر النفقة العامة دفع مبلغ من النقود (نقدي وليس عيني)."],
["تحقيق المنفعة العامة من عناصر النفقة العامة.",true,"هو العنصر الثاني من عناصرها."],
["الحرية والمساواة والمجانية هي القواعد التي تحكم الانتفاع بالمرافق العامة والأموال العامة.",true,"نص الملخص: يخضع استعمال الأموال العامة للقواعد العامة للانتفاع بالمرافق العامة: الحرية، المساواة، المجانية."],
["الهدف من الإنفاق العام إشباع الحاجات العامة وتوفير الخدمات الأساسية كالتعليم والصحة والأمن.",true,"وبذلك تتحقق المنفعة العامة."],
["من اعتبارات تقدير الإنفاق: حجم الموارد المالية للدولة ومستوى الناتج القومي.",true,"هذان هما الاعتباران الواردان في الملخص."],
["الناتج القومي هو قيمة السلع والخدمات النهائية التي ينتجها مواطنو الدولة خلال فترة زمنية محددة.",true,"هذا تعريفه في الملخص."],
["في الدول النامية تتركز النفقات العامة على التعليم والصحة والأمن والمرافق العامة.",true,"أوجه الصرف الأساسية."],
["في الدول المتقدمة تقتصر النفقات العامة على أوجه الصرف الأساسية فقط دون استثمار.",false,"تشمل الأساسية بالإضافة إلى التوسع في الاستثمار والمشروعات التنموية والتطوير الاقتصادي."],
["الإصدار النقدي من أنواع الإيرادات العامة.",true,"أهم الإيرادات: الضرائب، أثمان أملاك الدولة، الرسوم، القروض العامة، الإصدار النقدي."],
["انخفاض قيمة النقود من الأسباب الظاهرية لتزايد النفقات العامة.",true,"الأسباب الظاهرية: انخفاض قيمة النقود، اختلاف القيد المالي، زيادة مساحة الدولة."],
["التوسع الاستثماري والتنمية الاقتصادية سبب اجتماعي لتزايد النفقات.",false,"هو سبب اقتصادي، أما الاجتماعي فهو التعليم والصحة."],
["التعليم والصحة من الأسباب الاجتماعية لتزايد النفقات العامة.",true,"صحيح."],
["توسع الجهاز الحكومي سبب إداري لتزايد النفقات العامة.",true,"صحيح، من الأسباب الحقيقية الإدارية."],
["قدرة الدولة الأكبر على الاقتراض سبب مالي لتزايد النفقات العامة.",true,"صحيح، من الأسباب الحقيقية المالية."],
["زيادة مساحة الدولة من الأسباب الظاهرية لتزايد النفقات.",true,"ضمن الأسباب الظاهرية الثلاثة."],
["التضخم هو الارتفاع المستمر في المستوى العام للأسعار.",true,"تعريف التضخم."],
["في حالة التضخم تزيد الدولة نفقاتها العامة بصورة كبيرة.",false,"في التضخم تقلل النفقات أو تحد من زيادتها، وقد يرفع البنك المركزي أسعار الفائدة."],
["في حالة الركود الاقتصادي تزيد الدولة النفقات على المشروعات والخدمات والاستثمارات العامة.",true,"لتنشيط الاقتصاد."],
["قد يرفع البنك المركزي أسعار الفائدة في حالة التضخم.",true,"ضمن إجراءات مواجهة التضخم."],
["مبدأ الفاتكا الأمريكي ينص على كشف المعلومات الحسابية لكل حامل للجنسية الأمريكية لدى البنوك والمؤسسات المالية.",true,"هذا نصه في الملخص."],
["معيار بازل (Basel) يتعلق بمعايير رقابة الحسابات وكفاية رأس المال والتصنيفات المصرفية.",true,"كما ورد في الملخص."],
["مبدأ سنوية الموازنة يعني أنها تصدر عن سنة مالية واحدة مستقلة بإيراداتها ونفقاتها.",true,"صحيح."],
["كلما طالت الفترة الزمنية للموازنة زادت دقة التقديرات المالية.",false,"العكس: كلما قصرت الفترة زادت دقة التقديرات."],
["ترتيب المشروعات البديلة يكون على أساس المنافع النسبية (م ÷ ت) وليس المنافع الصافية (م - ت).",true,"لأن أولويات المشروع تتوقف على نسبة المنافع إلى التكاليف."],
["مبدأ الشيوع يقضي بتخصيص إيرادات معينة لنفقات محددة.",false,"بل يقضي بعدم تخصيص إيرادات معينة لنفقات محددة."],
["مبدأ وحدة الموازنة يعني إدراج كافة الإيرادات والنفقات في وثيقة واحدة.",true,"لتسهيل الرقابة عليها."],
["مبدأ توازن الموازنة يعني أن الاستخدامات (النفقات) = الإيرادات.",true,"هذا هو المبدأ الخامس."],
["تمر الموازنة العامة بأربع مراحل أساسية.",true,"الإعداد، الاعتماد، التنفيذ، إعداد الحساب الختامي."],
["يصدر قانون ربط الموازنة بعد موافقة مجلس النواب في مرحلة الاعتماد.",true,"مع وضع التأشيرات العامة والخاصة."],
["وزير المالية مسؤول عن متابعة الإنفاق في جميع الأبواب ما عدا الباب السادس.",true,"نص الملخص."],
["الباب السادس مسؤولية وزير التخطيط وبنك الاستثمار وفقًا للمحاضرة.",true,"كما ورد في الملخص."],
["الدومين العام أموال تملكها الدولة ملكية خاصة بقصد الحصول على الأرباح.",false,"هذا تعريف الدومين الخاص؛ الدومين العام ملكية عامة ومخصص للمنفعة العامة."],
["يجوز التصرف في الأموال العامة وتملكها بالتقادم والحجز عليها.",false,"من أوجه حمايتها: عدم جواز التصرف، عدم جواز التملك بالتقادم، وعدم جواز الحجز عليها."],
["الدومين الخاص وحده هو الذي يعنيه علماء المالية العامة كمصدر من مصادر الإيرادات العامة.",true,"نص الملحوظة في الملخص."]
];

/* ===== اختيار من متعدد: [السؤال, الصحيحة, [3 خاطئة], الشرح] ===== */
const MCQ=[
["المالية العامة هي:","النظام الذي تدرس به الدولة كيفية تنظيم الإيرادات والنفقات العامة لتحقيق أهدافها",["علم دراسة أسعار الأسهم في البورصة","نظام لإدارة أموال الأفراد فقط","دراسة التجارة الخارجية فقط"],"هذا تعريفها كما في الملخص."],

["أي مما يلي يُعد من النفقات العامة؟","دعم السلع التموينية الأساسية",["الغرامات","الضرائب","عوائد الاستثمارات الحكومية"],"النفقات: تسليح الجيش، التعليم، الصحة، الإنفاق الاستثماري، الأمن الغذائي، دعم السلع التموينية."],

["تنتهي السنة المالية في مصر يوم:","30 يونيو",["31 يونيو","30 سبتمبر","31 ديسمبر"],"لأن شهر يونيو 30 يومًا فقط."],

["قارن بين الدومين العام والدومين الخاص، واذكر أنواع الدومين الخاص.",
"<ul><li><b>الدومين العام:</b> أموال مملوكة للدولة أو لشخص عام ملكية عامة ومخصصة للمنفعة العامة (شرطا العمومية). أمثلة: الطرق، الجسور، المطار، المباني الإدارية، الحدائق العامة. حمايتها: عدم جواز التصرف فيها أو تملكها بالتقادم أو الحجز عليها. والانتفاع بها يخضع لقواعد: الحرية، المساواة، المجانية.</li><li><b>الدومين الخاص:</b> أموال مملوكة للدولة ملكية خاصة وتخضع للقانون الخاص بقصد الحصول على الإيرادات والأرباح، وهو وحده ما يعنيه علماء المالية العامة كمصدر للإيرادات.</li></ul><b>أنواع الدومين الخاص:</b> العقاري (الأراضي، الغابات، المناجم والمحاجر، المباني)، الصناعي (المشروعات الصناعية المملوكة للدولة)، المالي (الأسهم والسندات التي تدر أرباحًا وفوائد)."],
["تنوي الدولة توجيه مبلغ لدعم البنية الأساسية للتعليم، وأمامها 6 مشروعات تكاليفها (500، 300، 250، 200، 300، 400) ومنافعها (800، 400، 300، 350، 300، 370). وضّح كيف تختار أفضل المشروعات.",
"تُرتب المشروعات على أساس <b>المنافع النسبية (م ÷ ت)</b> وليس المنافع الصافية (م − ت)، لأن أولوية المشروع تتوقف على نسبة المنافع إلى التكاليف.<table><tr><th>المشروع</th><th>التكاليف</th><th>المنافع</th><th>الصافية</th><th>م÷ت</th><th>الترتيب</th></tr><tr><td>4</td><td>200</td><td>350</td><td>150</td><td>1.75</td><td>1</td></tr><tr><td>1</td><td>500</td><td>800</td><td>300</td><td>1.6</td><td>2</td></tr><tr><td>2</td><td>300</td><td>400</td><td>100</td><td>1.33</td><td>3</td></tr><tr><td>3</td><td>250</td><td>300</td><td>50</td><td>1.2</td><td>4</td></tr><tr><td>5</td><td>300</td><td>300</td><td>0</td><td>1</td><td>5</td></tr><tr><td>6</td><td>400</td><td>370</td><td>-30</td><td>0.93</td><td>6</td></tr></table>تُختار المشروعات بالترتيب حتى استنفاد الموازنة، فتُختار المشروعات الأولى في الترتيب وهي <b>4 و 1 و 2</b>، وإجمالي تكلفتها (200 + 500 + 300 = 1000) يعادل الموازنة المقترحة."]
];

/* ===== المحرك ===== */
const $=s=>document.querySelector(s);
let st={ok:0,bad:0,done:0};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function upd(){
  $('#done').textContent=st.done;$('#okc').textContent=st.ok;$('#badc').textContent=st.bad;
  $('#pct').textContent=st.done?Math.round(st.ok/st.done*100)+'%':'0%';
  $('#pbar').style.width=(st.done/100*100)+'%';
}
function answer(card,isRight,expHtml){
  st.done++;isRight?st.ok++:st.bad++;
  const e=card.querySelector('.exp');
  e.innerHTML=(isRight?'<span class="v g">✅ إجابة صحيحة! </span>':'<span class="v r">❌ إجابة خاطئة. </span>')+expHtml;
  e.classList.add('show');upd();
}
function build(){
  st={ok:0,bad:0,done:0};upd();$('#final').classList.remove('show');
  const tf=$('#tf'),mcq=$('#mcq'),es=$('#essay');tf.innerHTML='';mcq.innerHTML='';es.innerHTML='';
  TF.forEach((q,i)=>{
    const c=document.createElement('div');c.className='q';
    c.innerHTML=`<p class="t"><span class="n">${i+1}</span>${q[0]}</p><div class="opts tf"><button class="opt" data-v="true">✔ صح</button><button class="opt" data-v="false">✘ خطأ</button></div><div class="exp"></div>`;
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v=b.dataset.v==='true';const right=v===q[1];
      c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if((x.dataset.v==='true')===q[1])x.classList.add('right')});
      if(!right)b.classList.add('wrong');
      answer(c,right,`الإجابة الصحيحة: <b>${q[1]?'صح':'خطأ'}</b>.<br>${q[2]}`);
    });
    tf.appendChild(c);
  });
  MCQ.forEach((q,i)=>{
    const c=document.createElement('div');c.className='q';
    const opts=shuffle([q[1],...q[2]]);
    c.innerHTML=`<p class="t"><span class="n">${i+1}</span>${q[0]}</p><div class="opts"></div><div class="exp"></div>`;
    const box=c.querySelector('.opts');
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>{
        const right=o===q[1];
        box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===q[1])x.classList.add('right')});
        if(!right)b.classList.add('wrong');
        answer(c,right,`الإجابة الصحيحة: <b>${q[1]}</b>.<br>${q[3]}`);
      };
      box.appendChild(b);
    });
    mcq.appendChild(c);
  });
  ESSAY.forEach((q,i)=>{
    const c=document.createElement('div');c.className='q';
    c.innerHTML=`<p class="t"><span class="n">${i+1}</span>${q[0]}</p><textarea placeholder="اكتب إجابتك هنا ثم اضغط على إظهار الإجابة النموذجية..."></textarea><button class="btn">👁 إظهار الإجابة النموذجية</button><div class="model">${q[1]}</div>`;
    const btn=c.querySelector('.btn'),m=c.querySelector('.model');
    btn.onclick=()=>{m.classList.toggle('show');btn.textContent=m.classList.contains('show')?'🙈 إخفاء الإجابة النموذجية':'👁 إظهار الإجابة النموذجية'};
    es.appendChild(c);
  });
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));$('#'+b.dataset.t).classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
});
$('#reset').onclick=()=>{if(confirm('هل تريد إعادة الامتحان من البداية؟')){build();window.scrollTo({top:0,behavior:'smooth'})}};
$('#finish').onclick=()=>{
  const p=st.done?Math.round(st.ok/100*100):0;
  let msg=p>=85?'ممتاز! 🏆 أنت جاهز للامتحان':p>=65?'جيد جدًا 👏 راجع الأخطاء وهتبقى تمام':p>=50?'مقبول 🙂 محتاج مراجعة أكتر':'ما تزعلش 😉 الحياة يوم ليك ويوم عليك.. راجع وجرّب تاني';
  const f=$('#final');
  f.innerHTML=`<div class="big">${st.ok} / 100</div><p>أجبت على ${st.done} سؤال (الصح وخطأ والاختيار من متعدد) — الإجابات الصحيحة ${st.ok} والخاطئة ${st.bad}</p><p><b>${msg}</b></p><p style="color:var(--mut)">الأسئلة المقالية (10) تُراجع يدويًا مع الإجابة النموذجية.</p>`;
  f.classList.add('show');f.scrollIntoView({behavior:'smooth'});
};
build();
</script>
</body>
</html>
