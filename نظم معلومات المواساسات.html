<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان نظم معلومات المؤسسات التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06202b; --bg2:#0b3a4a; --card:#0f2f3d; --card2:#123c4e;
  --gold:#ffd166; --teal:#17c3b2; --pink:#f2476a; --green:#20b97a; --red:#e5484d;
  --text:#eaf6f8; --muted:#9cc3cc; --line:#1d4d60;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2) 60%,#0a4b5c);color:var(--text);min-height:100vh;line-height:1.8}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}

/* Header */
header{text-align:center;padding:36px 12px 18px}
.smile{width:110px;height:110px;margin:0 auto 6px;display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eyes{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.designer{font-size:clamp(24px,5vw,38px);font-weight:900;color:var(--gold);margin:6px 0 0;text-shadow:0 2px 12px rgba(255,209,102,.25)}
.quote{font-size:clamp(18px,3.6vw,24px);font-weight:700;color:var(--teal);margin:4px 0 18px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.dots i{width:14px;height:14px;border-radius:4px;transform:rotate(45deg);display:block}
h1{font-size:clamp(22px,4.6vw,34px);margin:6px 0 4px;font-weight:900}
.sub{color:var(--muted);font-size:15px}

/* Sticky bar */
.bar{position:sticky;top:0;z-index:20;background:rgba(6,32,43,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin:0 -16px 18px;padding-inline:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{flex:1 1 140px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 10px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.4}
.tab.active{background:var(--gold);color:#1a2b33;border-color:var(--gold)}
.tab.active small{color:#3a4a52}
.prog{height:8px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap;gap:6px}
.stat b{color:var(--gold)}

/* Questions */
.sec{display:none}.sec.active{display:block}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:14px;border-right:5px solid var(--teal)}
.q .n{display:inline-block;background:var(--teal);color:#05262e;font-weight:900;border-radius:8px;padding:0 10px;margin-left:8px;font-size:14px}
.q .t{font-weight:700;font-size:17px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:right;width:100%;background:var(--card2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(-3px)}
.opt .l{flex:0 0 28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--gold)}
.opt:disabled{cursor:default}
.opt.correct{background:rgba(32,185,122,.2);border-color:var(--green)}
.opt.wrong{background:rgba(229,72,77,.2);border-color:var(--red)}
.opt.correct .l{background:var(--green);color:#fff}
.opt.wrong .l{background:var(--red);color:#fff}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:17px}
.exp{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,209,102,.08);border:1px dashed var(--gold);font-size:15px}
.exp.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.verdict{font-weight:900;margin-bottom:4px}
.verdict.ok{color:var(--green)}.verdict.no{color:#ff7b80}
.q.done-ok{border-right-color:var(--green)}
.q.done-no{border-right-color:var(--red)}

/* Essay */
.q.essay{border-right-color:var(--pink)}
.q.essay .n{background:var(--pink);color:#fff}
textarea{width:100%;min-height:110px;margin-top:12px;background:var(--card2);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--gold);color:#1a2b33;border:0;border-radius:12px;padding:9px 18px;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}
.btn.alt{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.model ul{margin:6px 0 0;padding-inline-start:22px}
.model li{margin:2px 0}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
/* Result modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}
.box{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:24px;max-width:460px;width:100%;text-align:center}
.big{font-size:56px;font-weight:900;color:var(--gold);line-height:1.2}
.row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <svg class="smile" viewBox="0 0 120 120" aria-label="وجه مبتسم">
    <defs><radialGradient id="g" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#ffe38a"/><stop offset="1" stop-color="#ffb82e"/></radialGradient></defs>
    <circle cx="60" cy="60" r="54" fill="url(#g)" stroke="#e59a00" stroke-width="3"/>
    <g class="eyes"><ellipse cx="40" cy="48" rx="6.5" ry="9" fill="#4a2c00"/><ellipse cx="80" cy="48" rx="6.5" ry="9" fill="#4a2c00"/></g>
    <path d="M30 70 Q60 105 90 70" fill="none" stroke="#4a2c00" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="27" cy="68" rx="8" ry="5" fill="#ff8a65" opacity=".55"/><ellipse cx="93" cy="68" rx="8" ry="5" fill="#ff8a65" opacity=".55"/>
  </svg>
  <div class="designer">تصميم: أحمد حسين إبراهيم</div>
  <div class="quote">لا يأس مع الحياة 🌟</div>
  <div class="dots"><i style="background:#f4a100"></i><i style="background:#f2476a"></i><i style="background:#06a77d"></i><i style="background:#118ab2"></i><i style="background:#ffd166"></i></div>
  <h1>امتحان نظم معلومات المؤسسات</h1>
  <div class="sub">100 سؤال (50 صح وخطأ + 50 اختيار من متعدد) + 10 أسئلة مقالية — الإجابات مأخوذة من ملفات المحاضرات</div>
</header>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="prog"><div id="pbar"></div></div>
  <div class="stat"><span>تمت الإجابة: <b id="sDone">0</b> / 100</span><span>الصحيحة: <b id="sOk">0</b></span><span>الخاطئة: <b id="sNo">0</b></span></div>
</div>

<main>
  <section class="sec active" id="sec-tf"></section>
  <section class="sec" id="sec-mc"></section>
  <section class="sec" id="sec-es"></section>
</main>

<div class="actions">
  <button class="btn" id="finish">عرض النتيجة النهائية</button>
  <button class="btn alt" id="reset">إعادة الامتحان من جديد</button>
</div>
<footer>تصميم أحمد حسين إبراهيم — لا يأس مع الحياة 😊</footer>
</div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
/* ============ بيانات الأسئلة ============ */
// صح وخطأ: [العبارة, الإجابة(true/false), الشرح]
const TF = [
["تُشكّل نظم معلومات المؤسسات (EIS) العمود الفقري التقني والإداري للمنظمات المعاصرة.",true,"صحيح. EIS مجموعة متكاملة من البرمجيات والتطبيقات والأجهزة والبنية التحتية والبيانات والإجراءات التي تدعم العمليات اليومية والاستراتيجية. (المحاضرة الأولى)"],
["تعتمد نظم المؤسسات الحديثة على الأنظمة المستقلة المنعزلة (Isolated Systems) بدلاً من التكامل.",false,"خطأ. الأنظمة الحديثة تختلف عن التقليدية المستقلة باعتمادها التام على مبدأ «التكامل المؤسسي» وقواعد البيانات المركزية. (المحاضرة الأولى)"],
["من فوائد التكامل القضاء على ازدواجية البيانات (Data Redundancy) بإدخال البيانات مرة واحدة لتسري في كافة أقسام المنظمة.",true,"صحيح. التكامل يقضي على ازدواجية البيانات ويتيح تدفقاً فورياً وشفافاً للبيانات بين الإدارات. (المحاضرة الأولى)"],
["النظام الديناميكي هو نظام ثابت لا تتغير حالته مهما تغيرت بيئة العمل.",false,"خطأ. النظام الديناميكي مرن، تتعدل حالته باستمرار للتكيف مع التطورات والتقلبات في البيئة الداخلية والخارجية. (المحاضرة الأولى)"],
["النظام القائم على البيانات (Data-driven) يعتمد كلياً على الحدس والخبرات الشخصية في اتخاذ القرار.",false,"خطأ. هذا النظام يُنحّي الحدس والخبرات الشخصية جانباً ويعتمد على الجمع والتحليل المنهجي للبيانات كموجّه لاتخاذ القرارات. (المحاضرة الأولى)"],
["من الوظائف الست الجوهرية لنظم المؤسسات: جمع البيانات وتخزينها وتحليلها وتوزيعها وتسهيل الاتصال وأتمتة العمليات.",true,"صحيح. هذه هي الوظائف الست لشبكة النظم المؤسسية. (المحاضرة الأولى)"],
["نظام ERP يربط جميع الأقسام في نظام موحد، وقد يعتمد على الحوسبة السحابية أو هندسة العميل-الخادم (Client-Server).",true,"صحيح. ERP تطبيقات متكاملة تدير العمليات الأساسية (مالية، موارد بشرية، إنتاج، سلاسل توريد، مبيعات). (المحاضرة الأولى)"],
["نظام CRM هو المسؤول عن إدارة تدفق الإمدادات من الموردين إلى المستهلك.",false,"خطأ. هذا دور نظام SCM، أما CRM فيهدف إلى إدارة وتعميق العلاقات مع العملاء الحاليين والمحتملين. (المحاضرة الأولى)"],
["نظم SCM تنسق تدفق المنتجات والخدمات والتدفقات المالية من الموردين حتى المستهلك النهائي.",true,"صحيح. وأهميتها: خفض التكاليف المخزنية وتحسين التنبؤ بالطلب وزيادة الرؤية الشاملة لعمليات التوريد. (المحاضرة الأولى)"],
["تتطلب نظم إدارة المحتوى (CMS) معرفة برمجية عميقة لإنشاء المحتوى الرقمي ونشره.",false,"خطأ. تمكّن CMS من إنشاء المحتوى الرقمي وتعديله ونشره دون الحاجة إلى معرفة تقنية برمجية عميقة. (المحاضرة الأولى)"],
["تساعد نظم إدارة المعرفة (KMS) في الحفاظ على «الذاكرة المؤسسية» من الضياع عند استقالة الموظفين أو تقاعدهم.",true,"صحيح. تجمع KMS المعرفة الصريحة والضمنية وتنظمها وتشاركها. (المحاضرة الأولى)"],
["نظم تحليل الأعمال (BI) تحوّل البيانات الخام إلى معلومات مرئية وقابلة للفهم لمساعدة الإدارة العليا.",true,"صحيح. تساعد على اكتشاف الفرص وتحليل الاتجاهات المستقبلية وتحسين الأداء التشغيلي. (المحاضرة الأولى)"],
["نظم إدارة الموارد البشرية (HRMS) تؤتمت دورة حياة الموظف من التوظيف حتى التقاعد.",true,"صحيح. وتؤتمت الرواتب والإجازات وتحسّن تجربة الموظف عبر منصات الخدمة الذاتية. (المحاضرة الأولى)"],
["نظم إدارة الأصول (AMS) تتبع الأصول المادية وتديرها طوال دورة حياتها.",true,"صحيح. للتحكم في الصيانة الوقائية وإطالة العمر الافتراضي للأصل وتسهيل التدقيق والامتثال. (المحاضرة الأولى)"],
["المعيار الدولي ISO 14001 يتعلق بالسلامة والصحة المهنية.",false,"خطأ. ISO 14001 للبيئة، أما السلامة والصحة المهنية فهي ISO 45001، والجودة ISO 9001. (المحاضرة الأولى)"],
["التكلفة الكلية للملكية (TCO) تعني تكلفة شراء البرمجيات فقط.",false,"خطأ. TCO هي التكلفة الكلية وليست تكلفة الشراء فقط، فتشمل التخصيص والتدريب والصيانة. (المحاضرة الأولى)"],
["حجم المنظمة وعدد الموظفين هو «البوصلة الأولى» لأي قرار تقني عند اختيار النظام.",true,"صحيح. يحدد حجم الترخيص وقابلية التوسع ونطاق الصلاحيات. (المحاضرة الأولى)"],
["التقييم التجريبي (Pilot Evaluation) هو خط الدفاع الأخير للتحقق الميداني قبل توقيع العقود الملزمة.",true,"صحيح. يكون بتشغيل نسخة تجريبية مصغرة قبل التعميم لاكتشاف العيوب الخفية. (المحاضرة الأولى)"],
["معيار الأمن والسرية والملاءمة القانونية يهدف إلى تجنب المساءلة القانونية وحماية أسرار المنظمة والعملاء.",true,"صحيح. ويمنع كذلك المخاطر السيبرانية. (المحاضرة الأولى)"],
["من التحديات الرئيسية لتطبيق نظم المؤسسات: التكلفة العالية والتعقيد التقني ومقاومة التغيير وأمن البيانات.",true,"صحيح. هذه هي التحديات الأربعة الرئيسية المذكورة. (المحاضرة الأولى)"],
["الوظيفة هي مجموعة المسؤوليات والواجبات التي يقوم بها فرد معين داخل المنظمة.",true,"صحيح. وهي تحدد المهام والمهارات والمعرفة اللازمة لأدائها. (الفصل الثاني)"],
["يمكن تصنيف الوظائف بحسب القطاع إلى قطاع عام وقطاع خاص.",true,"صحيح. ومن معايير التصنيف أيضاً: المستوى الوظيفي والحجم والطبيعة. (الفصل الثاني)"],
["كلما زاد حجم المنظمة قل عدد الوظائف وتنوعها.",false,"خطأ. كلما زاد حجم المنظمة زاد عدد الوظائف وتنوعها. (الفصل الثاني)"],
["الإدارة العليا هي التي تشرف على الموظفين المباشرين وتضمن أداء المهام اليومية.",false,"خطأ. هذا دور الإدارة الدنيا، أما العليا فتضع الرؤية الاستراتيجية وتتخذ القرارات الرئيسية. (الفصل الثاني)"],
["الإدارة الوسطى تربط بين الإدارة العليا والموظفين وتتولى تنفيذ الخطط الاستراتيجية.",true,"صحيح. (الفصل الثاني)"],
["الوظائف الفنية تشمل الهندسة والتكنولوجيا والعلوم.",true,"صحيح. التكنولوجيا تشمل برمجة الحاسوب وتحليل البيانات وتطوير نظم المعلومات. (الفصل الثاني)"],
["وظيفة التدقيق تُعنى بإدارة أموال المنظمة واستثماراتها.",false,"خطأ. هذه وظيفة «المالية». التدقيق يتأكد من دقة السجلات المالية والامتثال للقوانين واللوائح. (الفصل الثاني)"],
["وظيفة المبيعات تعنى بالاتصال بالعملاء وإقناعهم بشراء المنتجات والخدمات.",true,"صحيح. أما التسويق فيحدد احتياجات العملاء ويطور استراتيجيات الترويج. (الفصل الثاني)"],
["إدارة المشاريع من الوظائف الإدارية والمكتبية.",true,"صحيح. وتشمل هذه الفئة أيضاً إدارة الموارد البشرية والأعمال المكتبية. (الفصل الثاني)"],
["تعتمد وظيفة المحاسبة على وظيفة المبيعات لتسجيل المبيعات.",true,"صحيح. وهذا مثال على تفاعل الوظائف؛ فالمبيعات تعتمد على الإنتاج لتوفير المنتجات. (الفصل الثاني)"],
["العمليات البينية هي مجموعة من الأنشطة المترابطة التي تحدث داخل المنظمة وتؤثر على بعضها البعض.",true,"صحيح. وتشمل مراحل المنتج أو الخدمة من التخطيط والإنتاج حتى التسويق والمبيعات وخدمة العملاء. (محاضرة العمليات البينية)"],
["حتى مع وجود التكامل قد تكون البيانات المدخلة في الأنظمة غير دقيقة أو غير متسقة، مما يؤثر على جودة التحليلات.",true,"صحيح. وهي من مشاكل وجود التكامل، مع صعوبة تنقية البيانات وتوحيدها. (محاضرة العمليات البينية)"],
["تكامل الأنظمة يقلل دائماً سطح الهجوم ويجعل النظام أقل عرضة للاختراقات.",false,"خطأ. يزيد التكامل من سطح الهجوم فيجعل النظام أكثر عرضة للاختراقات، لذا تجب حماية البيانات الحساسة. (محاضرة العمليات البينية)"],
["قد يؤدي تكامل العديد من الأنظمة إلى بطء الأداء وزيادة التحميل على البنية التحتية للشبكة والخوادم.",true,"صحيح. (محاضرة العمليات البينية)"],
["من خطوات تجاوز مشاكل وجود التكامل: وضع خطة تكامل شاملة تراعي الجوانب التقنية والتجارية.",true,"صحيح. إضافة إلى اختيار التقنيات المناسبة وتدريب الموظفين وجودة البيانات ومراقبة الأداء والأمن السيبراني. (محاضرة العمليات البينية)"],
["غياب التكامل يؤدي إلى تشتت البيانات وتأخر اتخاذ القرارات.",true,"صحيح. تتوزع البيانات على أنظمة مختلفة فيصعب الحصول على صورة متكاملة، ويتأخر المديرون في الحصول على المعلومات. (محاضرة العمليات البينية)"],

const ES = [

["صنّف أنواع الوظائف والأعمال داخل المنظمة مع شرح موجز لكل نوع، ثم بيّن كيف تتفاعل نظم المعلومات مع هذه الوظائف.",
`<p><b>الأنواع:</b></p><ul><li><b>الإدارية:</b> عليا (رؤية وقرارات)، وسطى (ربط وتنفيذ الخطط)، دنيا (إشراف يومي).</li><li><b>الفنية:</b> هندسة (تصميم المنتجات والعمليات)، تكنولوجيا (برمجة وتحليل بيانات ونظم معلومات)، علوم.</li><li><b>المالية:</b> محاسبة، مالية، تدقيق.</li><li><b>التسويقية:</b> تسويق، مبيعات.</li><li><b>الإدارية والمكتبية:</b> موارد بشرية، مشاريع، أعمال مكتبية.</li></ul>
<p><b>تفاعل نظم المعلومات:</b></p><ul><li>الموارد البشرية: التوظيف والتدريب وتقييم الأداء والرواتب.</li><li>المحاسبة والمالية: القوائم المالية والحسابات والمخزون.</li><li>الإنتاج: تخطيط الإنتاج وتتبع المخزون وجودة المنتجات.</li><li>المبيعات والتسويق: علاقات العملاء وتحليل السوق والحملات.</li><li>اللوجستيات: التخزين والنقل والتوزيع.</li></ul>`],

`<p><b>عوامل النجاح:</b> التخطيط الجيد، اختيار النظام المناسب، تدريب الموظفين، البدء بمشروع صغير، التعاون الوثيق مع المورد.</p>

["تحدّث عن أفضل ممارسات تدريب الموظفين على النظام الجديد.",
`<ul><li><b>التخطيط الدقيق:</b> أهداف التدريب، الفئات المستهدفة، مدربون أكفاء، خطة مفصلة بالمواضيع والمدد.</li><li><b>اختيار الطريقة:</b> نظري، عملي، تفاعلي (ورش ونقاشات)، إلكتروني، وتدريب على الوظيفة.</li><li><b>بيئة تعلم فعالة:</b> أجهزة وبرمجيات ومكان هادئ، مواد مبسطة، دعم فني مستمر.</li><li><b>التقييم المستمر:</b> اختبارات قبل وبعد التدريب، استبيانات رأي، متابعة الأداء في بيئة العمل.</li><li><b>تشجيع المشاركة:</b> مجتمع تعلم، وقت للأسئلة، دعم نفسي للتكيف مع التغيير.</li><li><b>التطوير المستمر:</b> ورش دورية ودعم بعد التدريب الأولي.</li><li><b>المواضيع الأساسية:</b> المفاهيم الأساسية، المهام اليومية، أفضل الممارسات، حل المشكلات الشائعة.</li></ul>`],

<tr><td>مقاومة التغيير (خوف من فقدان الوظائف أو زيادة العبء)</td><td>التواصل الفعال المستمر والتدريب الشامل</td></tr>

<tr><td>تعقيد التكامل مع الأنظمة القديمة</td><td>التكامل التدريجي بربط الأنظمة الأهم أولاً، والبدء بمشروع صغير</td></tr>
<tr><td>تكاليف وزمن التخصيص</td><td>الاستعانة بالخبراء والتركيز على المستخدم النهائي</td></tr>

<script>
/* ============ المنطق ============ */
const $ = s => document.querySelector(s);
const L = ['أ','ب','ج','د'];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let state;
function fresh(){state={tf:{ok:0,no:0,done:0},mc:{ok:0,no:0,done:0}}}

function updateStats(){
  const done=state.tf.done+state.mc.done, ok=state.tf.ok+state.mc.ok, no=state.tf.no+state.mc.no;
  $('#sDone').textContent=done; $('#sOk').textContent=ok; $('#sNo').textContent=no;
  $('#pbar').style.width=(done/100*100)+'%';
  $('#tab-tf small').textContent=`${state.tf.done}/${TF.length}`;
  $('#tab-mc small').textContent=`${state.mc.done}/${MC.length}`;
}

function finishQ(card,ok,kind,exp,verdictText){
  card.classList.add(ok?'done-ok':'done-no');
  const e=card.querySelector('.exp');
  e.innerHTML=`<div class="verdict ${ok?'ok':'no'}">${verdictText}</div>${exp}`;
  e.classList.add('show');
  state[kind].done++; ok?state[kind].ok++:state[kind].no++;
  updateStats();
}

function build(){
  fresh();
  // صح وخطأ
  const tf=$('#sec-tf'); tf.innerHTML='';
  TF.forEach((q,i)=>{
    const c=document.createElement('div'); c.className='q';
    c.innerHTML=`<div class="t"><span class="n">${i+1}</span>${q[0]}</div>
      <div class="opts tf"><button class="opt" data-v="true"><span class="l">✓</span>صح</button><button class="opt" data-v="false"><span class="l">✗</span>خطأ</button></div><div class="exp"></div>`;
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const chosen=b.dataset.v==='true', ok=chosen===q[1];
      c.querySelectorAll('.opt').forEach(x=>{
        x.disabled=true;
        if((x.dataset.v==='true')===q[1]) x.classList.add('correct');
      });
      if(!ok) b.classList.add('wrong');
      finishQ(c,ok,'tf',q[2],ok?'✔ إجابة صحيحة! أحسنت':`✘ إجابة خاطئة — الإجابة الصحيحة: ${q[1]?'صح':'خطأ'}`);
    });
    tf.appendChild(c);
  });
  // اختيار من متعدد
  const mc=$('#sec-mc'); mc.innerHTML='';
  MC.forEach((q,i)=>{
    const opts=shuffle([{t:q[1],c:true},...q[2].map(t=>({t,c:false}))]);
    const c=document.createElement('div'); c.className='q';
    c.innerHTML=`<div class="t"><span class="n">${i+1}</span>${q[0]}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-c="${o.c}"><span class="l">${L[k]}</span><span>${o.t}</span></button>`).join('')}</div><div class="exp"></div>`;
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.c==='true';
      c.querySelectorAll('.opt').forEach(x=>{x.disabled=true; if(x.dataset.c==='true') x.classList.add('correct')});
      if(!ok) b.classList.add('wrong');
      finishQ(c,ok,'mc',q[3],ok?'✔ إجابة صحيحة! أحسنت':`✘ إجابة خاطئة — الإجابة الصحيحة: ${q[1]}`);
    });
    mc.appendChild(c);
  });
  // مقالية
  const es=$('#sec-es'); es.innerHTML='';
  ES.forEach((q,i)=>{
    const c=document.createElement('div'); c.className='q essay';
    c.innerHTML=`<div class="t"><span class="n">${i+1}</span>${q[0]}</div>
      <textarea placeholder="اكتب إجابتك هنا ثم اضغط «إظهار الإجابة النموذجية» للمقارنة..."></textarea>
      <button class="btn">إظهار الإجابة النموذجية</button>
      <div class="exp model"><div class="verdict ok">📘 الإجابة النموذجية (من ملفات المحاضرات)</div>${q[1]}</div>`;
    const btn=c.querySelector('.btn'), ex=c.querySelector('.exp');
    btn.onclick=()=>{const s=ex.classList.toggle('show');btn.textContent=s?'إخفاء الإجابة النموذجية':'إظهار الإجابة النموذجية'};
    es.appendChild(c);
  });
  updateStats();
}

// التبويبات
const TABS=[['tf','صح وخطأ',TF.length],['mc','اختيار من متعدد',MC.length],['es','أسئلة مقالية',ES.length]];
$('#tabs').innerHTML=TABS.map(([k,n,c],i)=>`<button class="tab${i?'':' active'}" id="tab-${k}" data-k="${k}">${n}<small>${k==='es'?c+' أسئلة':'0/'+c}</small></button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('active',s.id==='sec-'+t.dataset.k));
  window.scrollTo({top:0,behavior:'smooth'});
});

function result(){
  const ok=state.tf.ok+state.mc.ok, done=state.tf.done+state.mc.done, pct=Math.round(ok/100*100);
  const msg=pct>=85?'ممتاز! أنت متمكن 🌟':pct>=65?'جيد جداً، واصل التقدم 👏':pct>=50?'جيد، راجع النقاط الخاطئة 📚':'لا يأس مع الحياة — راجع المحاضرات وأعد المحاولة 💪';
  $('#box').innerHTML=`<div style="font-size:42px">😊</div><div class="big">${pct}%</div><div style="font-weight:700;margin-bottom:12px">${msg}</div>
   <div class="row"><span>صح وخطأ</span><b>${state.tf.ok} / ${TF.length}</b></div>
   <div class="row"><span>اختيار من متعدد</span><b>${state.mc.ok} / ${MC.length}</b></div>
   <div class="row"><span>الأسئلة التي لم تُجب</span><b>${100-done}</b></div>
   <button class="btn" onclick="document.getElementById('modal').classList.remove('show')">إغلاق</button>`;
  $('#modal').classList.add('show');
}
