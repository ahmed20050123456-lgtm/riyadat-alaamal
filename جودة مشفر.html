<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0d1b2e;min-height:100vh;direction:rtl;user-select:none;-webkit-user-select:none}
::selection{background:transparent}
.hero{background:linear-gradient(135deg,#0a1628,#1a3a6b,#0f2040);padding:28px 16px 20px;text-align:center;border-bottom:3px solid #f0b429;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;left:-50px;width:200px;height:200px;border-radius:50%;background:rgba(240,180,41,.06);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60px;right:-60px;width:250px;height:250px;border-radius:50%;background:rgba(37,99,199,.08);pointer-events:none}
.badge{display:inline-block;background:linear-gradient(90deg,#f0b429,#f7c948);color:#0a1628;font-size:11px;font-weight:900;padding:4px 16px;border-radius:20px;margin-bottom:12px;letter-spacing:1px}
.hero h1{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900;color:#fff;margin-bottom:6px}
.hero h1 span{color:#f0b429}
.hero .sub{font-size:.95rem;color:#93c5fd;margin-bottom:3px;font-weight:600}
.hero .tag{font-size:.8rem;color:#f7c948;font-weight:700}
.hero .meta{display:flex;justify-content:center;gap:12px;margin-top:14px;flex-wrap:wrap}

.meta-i span{color:#f0b429;font-weight:900}
.score-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.sb-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sc-num{font-size:20px;font-weight:900;color:#1a4fa0;min-width:56px}
.sc-lbl{font-size:11px;color:#64748b;font-weight:600;line-height:1.3}
.pb-bg{flex:1;min-width:120px;height:8px;background:#e2e8f0;border-radius:8px;overflow:hidden}
.pb-fill{height:100%;background:linear-gradient(90deg,#1a4fa0,#f0b429);border-radius:8px;transition:width .4s;width:0%}
.pb-lbl{font-size:11px;color:#64748b;font-weight:600}
.pct{font-size:18px;font-weight:900;min-width:46px;text-align:center}

.tabs-in{max-width:860px;margin:0 auto;display:flex;gap:5px;flex-wrap:nowrap}
.tb{padding:8px 14px;border:none;border-bottom:3px solid transparent;background:transparent;color:#64748b;font-family:Arial,sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0;transition:all .2s}
.tb:hover{color:#1a4fa0;background:#eff6ff}
.tb.act{color:#1a4fa0;border-bottom-color:#1a4fa0;background:#eff6ff}
.main{max-width:860px;margin:0 auto;padding:20px 14px 48px}
.lec-hd{background:linear-gradient(90deg,#0a1628,#1a3a6b);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.lec-n{background:#f0b429;color:#0a1628;font-size:12px;font-weight:900;padding:4px 10px;border-radius:6px;flex-shrink:0}
.lec-t{font-size:14px;font-weight:700;color:#e2e8f0}
.lp-row{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:8px;padding:8px 14px;border:1px solid #e2e8f0;margin-bottom:16px}
.lp-bar{flex:1;height:5px;background:#e2e8f0;border-radius:5px;overflow:hidden}
.lp-fill{height:100%;background:linear-gradient(90deg,#1a4fa0,#f0b429);border-radius:5px;transition:width .4s}
.lp-txt{font-size:11px;font-weight:700;color:#475569;white-space:nowrap}
.sec-hd{display:flex;align-items:center;gap:10px;margin:24px 0 14px}
.sec-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sec-ico.tf{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
.sec-ico.mc{background:linear-gradient(135deg,#fef3c7,#fde68a)}
.sec-t h2{font-size:15px;font-weight:800;color:#0a1628;margin-bottom:2px}
.sec-t p{font-size:11px;color:#64748b;font-weight:500}
.qcard{background:#fff;border-radius:14px;border:1.5px solid #e2e8f0;padding:18px 20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);animation:fs .3s ease;transition:border-color .2s}
.qcard:hover{border-color:#bfdbfe}
.qcard.ok{border-color:#6ee7b7;background:#f0fdf4}
.qcard.no{border-color:#fca5a5;background:#fff7f7}

.qmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qbadge{background:#0a1628;color:#f0b429;font-size:10px;font-weight:900;padding:3px 9px;border-radius:20px}
.qst{font-size:17px;opacity:0;transition:opacity .3s}
.qst.vis{opacity:1}
.qtxt{font-size:14px;font-weight:600;color:#1e293b;line-height:1.65;margin-bottom:12px}
.tf-row{display:flex;gap:8px}
.tf-btn{flex:1;padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;background:#f8fafc;font-family:Arial,sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:5px}
.tf-btn:hover:not(:disabled){border-color:#1a4fa0;background:#eff6ff;transform:translateY(-1px)}
.tf-btn.ok{background:#d1fae5;border-color:#059669;color:#065f46}
.tf-btn.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.tf-btn.rv{background:#ecfdf5;border-color:#059669;color:#065f46;opacity:.75}
.tf-btn:disabled{cursor:default;transform:none}
.opts{display:flex;flex-direction:column;gap:7px}
.opt-btn{padding:10px 14px;border-radius:10px;border:2px solid #e2e8f0;background:#f8fafc;font-family:Arial,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:right;display:flex;align-items:center;gap:9px;transition:all .18s;line-height:1.5}
.opt-btn:hover:not(:disabled){border-color:#1a4fa0;background:#eff6ff;transform:translateX(-2px)}
.opt-btn.ok{background:#d1fae5;border-color:#059669;color:#065f46}
.opt-btn.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.opt-btn.rv{background:#ecfdf5;border-color:#059669;color:#065f46;opacity:.75}
.opt-btn:disabled{cursor:default;transform:none}
.ol{width:26px;height:26px;border-radius:7px;background:#e2e8f0;color:#475569;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,color .2s}
.opt-btn.ok .ol{background:#059669;color:#fff}
.opt-btn.no .ol{background:#dc2626;color:#fff}
.opt-btn.rv .ol{background:#059669;color:#fff}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:12px;font-weight:600;line-height:1.6;animation:fs .3s ease}
.fb.ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.fb.no{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.result{background:linear-gradient(135deg,#0a1628,#1a3a6b);border-radius:18px;padding:28px 24px;text-align:center;margin-top:28px;color:#fff;display:none;animation:fs .5s ease}
.result.show{display:block}
.re{font-size:52px;margin-bottom:10px}
.rt{font-size:20px;font-weight:900;color:#f0b429;margin-bottom:6px}
.rs{font-size:44px;font-weight:900;color:#fff;margin-bottom:4px}
.rsub{font-size:13px;color:#93c5fd;margin-bottom:18px}
.rg{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.rstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 18px;min-width:100px}
.rval{font-size:22px;font-weight:900;color:#f0b429}
.rlbl{font-size:11px;color:#93c5fd;margin-top:2px}
.rbtn{background:linear-gradient(90deg,#f0b429,#f7c948);color:#0a1628;border:none;padding:12px 32px;border-radius:10px;font-family:Arial,sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:0 4px 14px rgba(240,180,41,.35)}
.rbtn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(240,180,41,.5)}
@media(max-width:600px){.hero{padding:20px 12px 16px}.main{padding:14px 10px 40px}.qcard{padding:14px 12px}.tf-btn,.opt-btn{font-size:12px}}
</style>

(function(){

    if(e.key==='F12'||(e.ctrlKey&&e.key==='u')||(e.ctrlKey&&e.shiftKey&&['I','i','J','j','C','c','K','k'].includes(e.key))){

    console.log('%c',t);
  };
  setInterval(detect,1000);
  // Blur detection
  window.addEventListener('blur',()=>{setTimeout(detect,200)});
})();

{q:"ما الكلمة اليابانية التي تعني التحسين التدريجي المستمر؟",o:["Kanban","Kaizen","Lean","Keiretsu"],a:1,e:"كلمة KAIZEN يابانية تعني التحسين التدريجي المستمر."},
{q:"من أبرز سمات المجتمع الياباني التي ساعدت على نجاح TQM؟",o:["التنافس الفردي الشديد","أولوية الحقوق الفردية","التعاون والمشاركات الوجدانية","الاستقلالية الكاملة"],a:2,e:"التعاون والمشاركات الوجدانية من السمات التي ساعدت اليابان على تبني TQM بنجاح."},
{q:"مفهوم TQM وفق Robbins وCoulter هو:",o:["نظام رقابة على الإنتاج","فلسفة إدارية موجهة نحو التحسين المستمر وتلبية احتياجات العميل","برنامج لتخفيض التكاليف فقط","أسلوب للفحص النهائي"],a:1,e:"عرّف Robbins وCoulter TQM بأنها فلسفة إدارية موجهة على أساس التحسين المستمر والاستجابة للعميل."},
{q:"أيٌّ من هذه ليس تطبيقاً للجودة في المصانع؟",o:["فحص الجودة في كل مراحل الإنتاج","تدريب العمال على تقليل الأخطاء","زيادة عدد خطوط الإنتاج فقط","الحصول على منتج عالي الجودة بأقل تكلفة"],a:2,e:"زيادة خطوط الإنتاج بحد ذاتها ليست تطبيقاً للجودة؛ الجودة تتعلق بالأداء وتقليل الأخطاء."},
{q:"ما المعنى الذي تحمله كلمة الشاملة في TQM وفق Eric؟",o:["أن الجودة تشمل المنتجات فقط","أن كل شخص في المنشأة يشترك في برنامج الجودة","أن الجودة عملية شاملة لجميع الأسواق","أن الفحص يتم في جميع مراحل الإنتاج"],a:1,e:"الشاملة تعني أن كل شخص في المنشأة يجب أن يشترك في برنامج الجودة شخصياً أو عبر فرق العمل."},
{q:"أيٌّ من التالي ليس من فوائد TQM؟",o:["زيادة الإنتاجية","تحسين السمعة الطيبة","تغيير سلوكيات العاملين","تقليل مشاركة العاملين في التقييم"],a:3,e:"TQM تزيد من مشاركة العاملين في عملية مراجعة وتقييم الأداء، ولا تقلل منها."},
{q:"ما تعريف منظمة ISO للجودة؟",o:["الملاءمة للاستخدام","درجة تلبية الخصائص والسمات لمتطلبات العميل","العمل الصحيح من المرة الأولى","مدى المطابقة مع المتطلبات"],a:1,e:"ISO عرّفت الجودة بأنها درجة تلبية مجموعة الخصائص والسمات لسلعة أو خدمة ما لمتطلبات العميل."},
{q:"ما الهدف من دوائر الجودة؟",o:["زيادة الإنتاج الكمي","تحديد وتحليل وحل المشكلات المتعلقة بالعمل","رفع الرواتب","الرقابة على المديرين"],a:1,e:"دوائر الجودة تهدف إلى تحديد وتحليل وحل المشكلات المتعلقة بالعمل في أقسامهم."},
{q:"تطبيق صحيح للجودة في المطاعم هو:",o:["تنويع الأسعار فقط","الالتزام بمعايير النظافة وتوحيد جودة الطعام والاهتمام برأي الزبون","تسريع الخدمة على حساب الجودة","التركيز على الديكور فقط"],a:1,e:"تطبيق الجودة في المطاعم يشمل النظافة وتوحيد الطعم والجودة والاهتمام بالزبون وسرعة الخدمة."},
{q:"ما تعريف Joliblonski لإدارة الجودة الشاملة؟",o:["نظام للتفتيش على المنتجات النهائية","شكل تعاوني لأداء الأعمال بتحريك المواهب والقدرات لتحسين الجودة","مدخل لتخفيض الأجور","برنامج لزيادة الإنتاج الكمي"],a:1,e:"يعرّف Joliblonski TQM بأنها شكل تعاوني لأداء الأعمال بتحريك المواهب والقدرات للعاملين والإدارة."},
{q:"أيٌّ مما يلي مرحلة متقدمة في تطور إدارة الجودة؟",o:["الفحص والتفتيش فقط","الرقابة النهائية على المنتج","إدارة الجودة الشاملة كفلسفة متكاملة","فحص المواد الخام فقط"],a:2,e:"إدارة الجودة الشاملة كفلسفة إدارية متكاملة هي المرحلة الأكثر تطوراً في مسيرة الجودة."},
{q:"ما طبيعة TQM وفق مفهوم Tunks؟",o:["التزام الإدارة فقط","التزام وتعهد كل من الإدارة والعاملين بتلبية توقعات المستفيد","تعهد العاملين فقط دون الإدارة","نظام تقني متخصص"],a:1,e:"يعرّف Tunks TQM بأنها التزام وتعهد كل من الإدارة والعاملين بتلبية توقعات المستفيد أو ما يفوقها."},
{q:"الكلمة الأدق لوصف الجودة في ضوء تعريفات الرواد:",o:["الكمال","الرخص","الإتقان والأداء الصحيح المستمر وفق معايير لتلبية توقعات العملاء","الكثرة الإنتاجية"],a:2,e:"الجودة هي الإتقان في العمل وأدائه صحيحاً على الدوام وفق معايير لتقديم منتج يلبي توقعات العملاء."},
{q:"أيٌّ مما يلي ليس من سمات المجتمع الياباني؟",o:["العائلة والتعاون","الاهتمام بالعنصر البشري","التنافس الشديد والأنانية","التركيز في التطبيق والتكيف"],a:2,e:"التنافس الشديد والأنانية ليسا من سمات المجتمع الياباني؛ بل يتميز بالتعاون والمشاركة الجماعية."},
{q:"ما الذي تعنيه كلمة إدارة في TQM وفق Eric؟",o:["الإشراف والرقابة التقليدية","وجود فلسفة تركز على العميل من خلال التنظيم","التحكم في الموظفين","إصدار القرارات الإدارية فقط"],a:1,e:"إدارة تعني وجود فلسفة قوامها التركيز على العميل من خلال التنظيم لا الإشراف فقط."},
{q:"ما الهدف من تطبيق الجودة في المستشفيات؟",o:["تقليل عدد الموظفين","صحة المريض ورضاه من خلال تقليل أخطاء العلاج","زيادة أسعار الخدمات","تسريع الخروج فقط"],a:1,e:"الهدف من الجودة في المستشفيات هو صحة المريض ورضاه من خلال تقليل الأخطاء والالتزام بالسلامة."},
{q:"ما أثر تطبيق الجودة في التعليم؟",o:["زيادة عدد الطلاب فقط","تطوير المناهج وتدريب المدرسين مما يؤدي إلى تحسين التعليم ورضا الطلاب","خفض رسوم الدراسة","تقليل عدد المواد الدراسية"],a:1,e:"تطوير المناهج وتدريب المدرسين يؤدي إلى تحسين طرق الشرح وتقديم تعليم أفضل ورضا الطلاب."},
{q:"ما المقصود بالعميل الداخلي في TQM؟",o:["العميل الذي يشتري من داخل المنشأة مباشرة","العاملون الذين يتلقون مخرجات عمل زملائهم داخل المنظمة","الإدارة العليا فقط","المورّدون الذين يبيعون للمنشأة"],a:1,e:"العميل الداخلي هو الموظف أو القسم الذي يتلقى مخرجات عمل زميله أو قسم آخر داخل نفس المنظمة."},
{q:"ما الفرق بين مفهوم Joliblonski ومفهوم Tunks؟",o:["لا فرق بينهما","Joliblonski يركز على التعاون وتحريك المواهب؛ Tunks يركز على الالتزام والتعهد بتلبية توقعات المستفيد","Joliblonski يركز على الربح؛ Tunks يركز على التفتيش","كلاهما يركز على الفحص النهائي"],a:1,e:"Joliblonski يرى TQM شكلاً تعاونياً لتحريك المواهب بينما يرى Tunks أنها التزام وتعهد بتلبية توقعات المستفيد."}
]},
1:{title:"المحاضرة الثانية: وجهات نظر الجودة",
tf:[
{q:"وجهة نظر العميل في الجودة ترى أن الجودة تُحدَّد من قِبَل المنتج لا العميل.",a:false,e:"العكس صحيح؛ وجهة نظر العميل ترى أن الجودة يُحددها العميل وليس المنتج."},
{q:"دورة PDCA تتكون من أربع مراحل: خطط، نفّذ، تحقق، تصرف.",a:true,e:"صحيح، دورة ديمنج PDCA: Plan خطط، Do نفّذ، Check تحقق، Act تصرف."},
{q:"مرحلة Do في PDCA تبدأ عادةً بتجربة صغيرة Pilot.",a:true,e:"صحيح، في مرحلة التنفيذ تُطبَّق الخطة أولاً على نطاق تجريبي صغير."},
{q:"مخطط Fishbone سُمّي بهذا الاسم لأن شكله يشبه هيكل السمكة.",a:true,e:"صحيح، شكل المخطط يشبه هيكل السمكة: رأس يمثل المشكلة وعظام تمثل الأسباب."},
{q:"في مخطط Fishbone تشير العظام الكبيرة إلى الأسباب الفرعية.",a:false,e:"العكس صحيح؛ العظام الكبيرة تشير إلى الأسباب الرئيسية، والعظام الصغيرة للأسباب الفرعية."},
{q:"نموذج 6M في التصنيع يشمل الأفراد والآلات والمواد والطريقة والقياس والبيئة.",a:true,e:"صحيح، نموذج 6M يشمل: Man, Machine, Material, Method, Measurement, Mother Nature."},
{q:"الجودة التقليدية تركز على بناء الجودة منذ البداية وإشراك جميع العاملين.",a:false,e:"هذه خصائص TQM؛ أما الجودة التقليدية فتركز على الفحص النهائي."},
{q:"الجودة الشاملة تتبنى منظوراً قصير المدى للتحسين.",a:false,e:"إدارة الجودة الشاملة تتبنى التحسين المستمر طويل المدى، لا قصير المدى."},
{q:"مخطط Fishbone يهدف إلى البحث عن السبب الجذري Root Cause للمشكلة.",a:true,e:"صحيح، الهدف الرئيسي لمخطط Fishbone هو الكشف عن السبب الجذري وليس فقط علاج الأعراض."},
{q:"مرحلة Check في PDCA تُقارن فيها النتائج بالأهداف لقياس نجاح الحل.",a:true,e:"صحيح، في مرحلة Check يُقارن الأداء الفعلي بالأهداف للتأكد من نجاح التجربة."},
{q:"وجهة نظر التصنيع في الجودة تهتم بالعلاقة بين الجودة والسعر.",a:false,e:"العلاقة بين الجودة والسعر هي وجهة نظر القيمة، أما التصنيع فيركز على المواصفات وتقليل العيوب."},
{q:"الحل التقليدي للمشكلة يعالج السبب الجذري، في حين يعالج Fishbone النتيجة فقط.",a:false,e:"العكس صحيح؛ الحل التقليدي يعالج النتيجة، بينما Fishbone يبحث عن السبب الجذري."},
{q:"كروسبي رأى أن الجودة مسؤولية إدارية وليست وظيفة قسم معين فقط.",a:true,e:"صحيح، كروسبي أكّد أن الجودة مسؤولية إدارية شاملة وليست محدودة بقسم بعينه."},
{q:"وجهة نظر الإدارة في TQM تتطلب إشراك جميع الموظفين والتعاون بين الأقسام.",a:true,e:"صحيح، وجهة نظر الإدارة تتطلب إشراك الجميع والتعاون بين الأقسام (العميل الداخلي)."},
{q:"إدارة الجودة الشاملة تعتمد على كشف الأخطاء بعد الإنتاج كمنهجها الأساسي.",a:false,e:"إدارة الجودة الشاملة تركز على منع الأخطاء قبل حدوثها لا كشفها بعد الإنتاج."},
{q:"JURAN قدّم مفهوم ثلاثية الجودة: التخطيط والرقابة والتحسين المستمر.",a:true,e:"صحيح، ثلاثية جوران تضم: تخطيط الجودة، رقابة الجودة، تحسين الجودة."},
{q:"في مرحلة ACT من PDCA، إذا كانت النتائج إيجابية يتم تعميم الحل على نطاق أوسع.",a:true,e:"صحيح، في حالة النتائج الإيجابية يُعمَّم الحل، وإذا كانت سلبية تُعدَّل الخطة وتبدأ دورة جديدة."},
{q:"الجودة من وجهة نظر القيمة تربط الجودة بعلاقة الجودة مع السعر.",a:true,e:"صحيح، وجهة نظر القيمة تربط الجودة بتقديم أفضل أداء ممكن مقابل تكلفة معقولة."},
{q:"الجودة التقليدية تعتبر الجودة مسؤولية جميع العاملين.",a:false,e:"في الجودة التقليدية الجودة مسؤولية قسم الجودة فقط، أما في TQM فهي مسؤولية الجميع."},
{q:"رأس السمكة في مخطط Fishbone يشير إلى المشكلة المراد تحليلها.",a:true,e:"صحيح، رأس السمكة يمثل المشكلة أو العرض المراد تحليل أسبابه."},
{q:"وجهة نظر العمليات تهتم بالتحسين المستمر للعمليات لا برضا العميل.",a:false,e:"وجهة العمليات لا تتعارض مع رضا العميل؛ هي ترى أن تحسين العمليات يُحقق رضا العميل."},
{q:"مرحلة Plan في PDCA تتضمن تحديد المشكلة وتحليل أسبابها.",a:true,e:"صحيح، في مرحلة التخطيط تُحدَّد المشكلة وتُحلَّل أسبابها ويُوضع هدف قابل للقياس."},
{q:"الجودة الشاملة تتبنى مسؤولية جميع العاملين عن الجودة.",a:true,e:"صحيح، أحد أبرز مبادئ TQM أن الجودة مسؤولية الجميع لا قسم بعينه."},
{q:"أدوات الرقابة الإحصائية تُستخدم في وجهة نظر التصنيع لقياس الانحراف عن المعايير.",a:true,e:"صحيح، وجهة التصنيع تستخدم الأدوات الإحصائية لقياس درجة الانحراف عن المواصفات."},
{q:"الجودة الشاملة تتطلب تغيير الثقافة المؤسسية وإشراك الجميع.",a:true,e:"صحيح، الجودة الشاملة تتطلب التزام الإدارة العليا وتغيير الثقافة المؤسسية وإشراك الجميع."}
],

{q:"في وجهة نظر القيمة، الجودة مرتبطة بـ:",o:["سرعة الإنتاج فقط","العلاقة بين الجودة والسعر","حجم الإنتاج","مواصفات المنتج فقط"],a:1,e:"وجهة القيمة ترى أن الجودة هي تقديم أفضل أداء ممكن مقابل تكلفة معقولة."},
{q:"أيٌّ من التالي من مميزات الجودة الشاملة مقارنةً بالتقليدية؟",o:["تركز على الفحص النهائي","مسؤولية قسم الجودة فقط","تمنع الأخطاء قبل حدوثها","منظور قصير المدى"],a:2,e:"إدارة الجودة الشاملة تمنع الأخطاء قبل حدوثها بخلاف الجودة التقليدية التي تكشفها بعد الوقوع."},
{q:"ما سؤال مرحلة Do في PDCA؟",o:["هل تم التحسين فعلاً؟","لنجرب الحل عملياً","ما الذي سنحسّنه؟","هل نعمّم الحل؟"],a:1,e:"مرحلة Do تطرح السؤال: لنجرب الحل عملياً من خلال التطبيق على نطاق تجريبي."},
{q:"كروسبي يرى أن الجودة مسؤولية:",o:["قسم الجودة فقط","الإدارة العليا فقط","مسؤولية إدارية وليست وظيفة قسم معين","المهندسين فقط"],a:2,e:"كروسبي أكّد أن الجودة مسؤولية إدارية شاملة وليست محدودة بقسم الجودة وحده."},
{q:"الجودة من وجهة نظر الإدارة تتطلب:",o:["شراء معدات جديدة","إلزام الجودة بقسم التصنيع","التزام الإدارة العليا وتغيير الثقافة وإشراك الموظفين","التركيز على الإنتاج الكمي فقط"],a:2,e:"وجهة الإدارة تتطلب: التزام الإدارة العليا، تغيير الثقافة المؤسسية، إشراك جميع الموظفين."},
{q:"إيشيكاوا طوّر مخطط Fishbone الذي يُعرف أيضاً بـ:",o:["مخطط Pareto","مخطط السبب والنتيجة","مخطط التدفق","مخطط Gantt"],a:1,e:"مخطط Fishbone يُعرف بمخطط السبب والنتيجة (Cause and Effect Diagram) أو مخطط إيشيكاوا."},
{q:"ما يحدث في مرحلة Act إذا كانت النتائج غير مرضية؟",o:["إيقاف المشروع","تعميم الحل الحالي","تعديل الخطة والبدء من جديد","رفع تقرير للإدارة فقط"],a:2,e:"إذا كانت النتائج غير مرضية، تُعدَّل الخطة وتبدأ الدورة من مرحلة Plan من جديد."},
{q:"أيٌّ من التالي يخص وجهة نظر العميل في الجودة؟",o:["التركيز على مطابقة المواصفات الفنية","الجودة تُحدَّد من قِبَل العميل وترتبط برضاه","التركيز على تقليل تكاليف الإنتاج","الاهتمام بالأدوات الإحصائية"],a:1,e:"وجهة نظر العميل ترى أن الجودة يُحددها العميل وأن المنتج ذو جودة إذا حقق توقعاته."},
{q:"ما الهدف من مخطط Fishbone؟",o:["رسم خريطة العمليات الإنتاجية","تحديد الأسباب الجذرية لمشكلة بدل الاكتفاء بعلاج الأعراض","تحديد تكاليف الإنتاج","قياس رضا العملاء"],a:1,e:"هدف Fishbone تحليل المشكلة منهجياً لكشف السبب الجذري، وهو أداة تشخيص وليس علاج."},
{q:"الجودة الشاملة مقارنةً بالتقليدية ذات منظور:",o:["قصير المدى","لا فرق في المدى","طويل المدى مع تحسين مستمر","يتوقف على طبيعة المنتج"],a:2,e:"إدارة الجودة الشاملة تتبنى منظوراً طويل المدى قائماً على التحسين المستمر."},
{q:"ما المقصود بالعميل الداخلي في وجهة نظر الإدارة؟",o:["الإدارة العليا","التعاون بين الأقسام الداخلية كعملاء لبعضهم","الموردون","المساهمون"],a:1,e:"العميل الداخلي هو الأقسام والموظفون داخل المنظمة الذين يتلقون مخرجات عمل بعضهم."},
{q:"أيٌّ من التالي مثال على وجهة نظر القيمة في الجودة؟",o:["تقليل الأجور لخفض التكلفة","مطابقة المواصفات الفنية","تقديم أفضل جودة بسعر يشعر معه العميل أنه مقابل ما دفعه","الفحص الشامل للمنتجات"],a:2,e:"وجهة القيمة ترى أن الجودة هي تقديم أفضل أداء مقابل سعر معقول يشعر معه العميل بالرضا."},
{q:"ما معنى الوقاية من الخطأ أفضل من اكتشافه بعد الإنتاج في سياق PDCA؟",o:["يجب تقليل مرحلة Check","مرحلة Plan الأهم لأنها تمنع الأخطاء قبل حدوثها","الدورة تبدأ من Act","لا داعي لمرحلة Do"],a:1,e:"التخطيط الجيد في Plan يمنع الأخطاء، أي الوقاية قبل التنفيذ أفضل من اكتشاف الخطأ بعد الإنتاج."},
{q:"أيٌّ من التالي يُعبّر عن الفرق بين الجودة التقليدية والشاملة في مسؤولية الجودة؟",o:["كلتاهما تُعين قسم الجودة المسؤول","التقليدية: قسم الجودة فقط — الشاملة: جميع العاملين","التقليدية: جميع العاملين — الشاملة: الإدارة فقط","لا فرق في المسؤولية"],a:1,e:"الفرق الجوهري: في التقليدية الجودة مسؤولية قسم الجودة، وفي الشاملة هي مسؤولية جميع العاملين."},
{q:"ما الفرق بين وجهة نظر القيمة ووجهة نظر التصنيع في الجودة؟",o:["لا فرق","التصنيع يهتم بالعلاقة بين الجودة والسعر؛ القيمة تهتم بالمواصفات الفنية","القيمة تهتم بالعلاقة بين الجودة والسعر؛ التصنيع يهتم بمطابقة المواصفات وتقليل العيوب","كلاهما يركز على رضا العميل فقط"],a:2,e:"القيمة تربط الجودة بالعلاقة بين الأداء والسعر، بينما التصنيع يركز على مطابقة المواصفات وتقليل العيوب والهدر."}
]},
2:{title:"المحاضرة الثالثة: مبادئ TQM والتطور التاريخي",
tf:[
{q:"التوجه بالعميل يعني أن رغبات العميل الخارجي فقط هي نقطة البداية.",a:false,e:"التوجه بالعميل يشمل كلاً من العميل الداخلي والخارجي في جميع أنشطة المنشأة."},
{q:"كلمة KAIZEN يابانية تعني التحسين التدريجي المستمر.",a:true,e:"صحيح، KAIZEN يابانية تعني التحسين التدريجي المستمر."},
{q:"في الولايات المتحدة وصفوا جهد التحسين المستمر بصفر من العيوب.",a:true,e:"صحيح، استُخدم في الولايات المتحدة مفهوم صفر من العيوب لوصف هدف التحسين المستمر."},
{q:"التغذية العكسية هي معلومات تحصل عليها المنظمة من موردّيها عن العمليات الإنتاجية.",a:false,e:"التغذية العكسية معلومات تحصل عليها المنظمة من عملائها تتعلق بمستوى رضاهم."},
{q:"نجاح TQM يتوقف على مدى قناعة الإدارة العليا بفوائدها وضرورتها.",a:true,e:"صحيح، دعم الإدارة العليا ركيزة أساسية لنجاح تطبيق إدارة الجودة الشاملة."},
{q:"مرحلة الرقابة الإحصائية على الجودة بدأت في القرن العشرين مع مساهمات Shewhart.",a:true,e:"صحيح، بدأت الرقابة الإحصائية في أوائل القرن العشرين مع مساهمات Shewhart."},
{q:"المشاركة والعمل الجماعي يعني تشجيع المنافسة بين المستويات الإدارية.",a:false,e:"المشاركة تعني التعاون بين المستويات وليس المنافسة، وهذا مبدأ أساسي في TQM."},
{q:"مرحلة الفحص والتفتيش ركزت على فحص المنتج النهائي واكتشاف العيوب وتصحيحها.",a:true,e:"صحيح، مرحلة الفحص والتفتيش كانت تعتمد على فحص المنتج النهائي وتصحيح العيوب."},
{q:"تعبئة خبرات القوى العاملة تعني استثمار معارف وأفكار الموظفين لتطوير العمل.",a:true,e:"صحيح، الموظفون لديهم معلومات وأفكار يمكن استثمارها لتطوير العمل وزيادة الأرباح."},
{q:"مرحلة إدارة الجودة الشاملة TQM ظهرت قبل عام 1950.",a:false,e:"مرحلة TQM ظهرت بعد عام 1980 نتيجة اشتداد المنافسة العالمية."},
{q:"مبدأ التركيز على جودة العمليات يمتد ليشمل تصميم العمليات وليس فقط النتائج.",a:true,e:"صحيح، الجودة لم تعد تقتصر على النتائج بل تمتد لتشمل العمليات وتصميمها."},
{q:"مرحلة تكوين حلقات الجودة برزت في أمريكا وليس اليابان.",a:false,e:"مرحلة تكوين حلقات الجودة برزت في اليابان حيث أصبحت الجودة مسؤولية جماعية."},
{q:"اتخاذ القرار بناءً على معلومات وحقائق يساعد في نجاح المنظمة في عالم متغير.",a:true,e:"صحيح، القرار المبني على معلومات وليس تكهنات يجب أن يكون سريعاً ودقيقاً ومدروساً."},
{q:"مرحلة تأكيد الجودة ظهرت في منتصف القرن العشرين مع Feigenbaum.",a:true,e:"صحيح، ظهرت مرحلة تأكيد الجودة مع Feigenbaum الذي طرح مفهوم الرقابة الشاملة على الجودة."},
{q:"الوقاية من الأخطاء تحاول إدخال عنصر الوقاية في العملية الإنتاجية ومراقبة الانحرافات.",a:true,e:"صحيح، الوقاية تحاول إدخال عنصر الوقاية في العملية الإنتاجية ذاتها ومراقبة الانحرافات."},
{q:"تعبئة خبرات العاملين تجعلهم يشعرون بأنهم أعضاء في فريق فائز.",a:true,e:"صحيح، إشعار العاملين بأنهم أعضاء في فريق فائز يزيد انتماءهم وأدائهم."},
{q:"مرحلة الرقابة الإحصائية هدفها التحكم في العمليات وتقليل الانحرافات.",a:true,e:"صحيح، هدفت هذه المرحلة إلى التحكم في العمليات الإنتاجية وتقليل الانحرافات."},
{q:"حلقات الجودة ساهمت في تحسين الأداء وتعزيز ثقافة المشاركة والتحسين المستمر.",a:true,e:"صحيح، هذه ثمار مرحلة تكوين حلقات الجودة التي ذكرتها المحاضرة."},
{q:"إدارة القوى البشرية في المنشأة ذات أولوية ثانوية في TQM.",a:false,e:"إدارة القوى البشرية ذات أولوية كبيرة في TQM، وتوفر المهارات والتدريب من أهم ركائزها."},
{q:"مبدأ دعم الإدارة العليا يعني أن الإدارة فقط هي المسؤولة عن الجودة.",a:false,e:"دعم الإدارة العليا ضروري لكنه لا يعني أن الجودة مسؤوليتها وحدها؛ بل هي مسؤولية الجميع."},
{q:"المشاركة في TQM تؤكد التعاون بين مختلف المستويات بدلاً من المنافسة.",a:true,e:"صحيح، يركز نظام TQM على أهمية التعاون بين مختلف المستويات بدلاً من المنافسة الداخلية."},
{q:"التحسين المستمر في TQM مسؤولية الإدارة العليا فقط.",a:false,e:"التحسين المستمر مسؤولية جميع العاملين في كافة المستويات التنظيمية."},
{q:"مرحلة إدارة الجودة الشاملة قامت على مشاركة جميع أفراد المنظمة وتحسين مستمر.",a:true,e:"صحيح، TQM تقوم على التحسين المستمر للجودة وبناء علاقات فعالة مع العملاء ومشاركة الجميع."},
{q:"التغذية العكسية تقيّم وضع المنظمة لدى عملائها.",a:true,e:"صحيح، التغذية العكسية وسيلة تمكن المنظمة من تقييم وضعها لدى عملائها."},
{q:"ظهرت مرحلة TQM نتيجة اشتداد المنافسة العالمية بعد 1980.",a:true,e:"صحيح، ظهرت مرحلة TQM بعد عام 1980 استجابةً لاشتداد المنافسة العالمية."}
],
mc:[
{q:"ما المبدأ القائل بأن رغبات العميل هي نقطة البداية والنهاية لأي نشاط؟",o:["التحسين المستمر","التوجه بالعميل","دعم الإدارة العليا","اتخاذ القرار المبني على المعلومات"],a:1,e:"مبدأ التوجه بالعميل يعني أن رغبات واحتياجات العميل هي نقطة البداية والنهاية لأي نشاط."},
{q:"ما معنى كلمة KAIZEN؟",o:["كلمة صينية تعني الجودة","كلمة يابانية تعني التحسين التدريجي المستمر","كلمة أمريكية تعني صفر عيوب","اختصار لنظام TQM"],a:1,e:"KAIZEN كلمة يابانية استُخدمت لوصف عملية التحسين التدريجي المستمر في TQM."},
{q:"ما المرحلة الأولى في التطور التاريخي لإدارة الجودة؟",o:["تأكيد الجودة","الرقابة الإحصائية","الفحص والتفتيش","حلقات الجودة"],a:2,e:"مرحلة الفحص والتفتيش هي الأولى وظهرت مع بدايات الثورة الصناعية في القرن الثامن عشر."},
{q:"مع من ارتبطت مرحلة الرقابة الإحصائية على الجودة؟",o:["Feigenbaum","Crosby","Shewhart","Juran"],a:2,e:"مرحلة الرقابة الإحصائية ارتبطت بمساهمات Shewhart في أوائل القرن العشرين."},
{q:"ما مبدأ TQM الذي يركز على اكتساب معلومات من العملاء عن مستوى رضاهم؟",o:["تعبئة الخبرات","دعم الإدارة العليا","التغذية العكسية","الوقاية من الأخطاء"],a:2,e:"التغذية العكسية هي معلومات تحصل عليها المنظمة من عملائها عن مستوى رضاهم."},
{q:"أيٌّ من التالي ليس من مبادئ TQM؟",o:["التوجه بالعميل","التحسين المستمر","المنافسة الداخلية بين الأقسام","دعم الإدارة العليا"],a:2,e:"المنافسة الداخلية تُضعف TQM؛ بل إن مبدأ المشاركة يؤكد التعاون لا المنافسة بين الأقسام."},
{q:"متى ظهرت مرحلة TQM وما سببها؟",o:["1950، بسبب الحرب العالمية","1980، بسبب اشتداد المنافسة العالمية","1960، بسبب الثورة التكنولوجية","1990، بسبب عولمة الاقتصاد"],a:1,e:"TQM ظهرت بعد عام 1980 نتيجة اشتداد المنافسة العالمية."},
{q:"مرحلة تأكيد الجودة ركزت على:",o:["اكتشاف العيوب بعد الإنتاج","منع الأخطاء قبل وقوعها من خلال الرقابة الوقائية","الرقابة الإحصائية على خطوط الإنتاج","الفحص النهائي للمنتجات"],a:1,e:"مرحلة تأكيد الجودة ركزت على منع الأخطاء قبل وقوعها واعتبار الجودة ميزة تنافسية."},
{q:"أيٌّ من التالي صحيح عن حلقات الجودة؟",o:["ظهرت في أمريكا","هدفها تحديد المسؤوليات القانونية","ساهمت في تحسين الأداء وتعزيز ثقافة المشاركة","تضم الإدارة العليا فقط"],a:2,e:"حلقات الجودة ظهرت في اليابان وساهمت في تحسين الأداء وتعزيز ثقافة المشاركة والتحسين المستمر."},
{q:"ما مبدأ TQM المتعلق بعدم اتخاذ قرارات ارتجالية؟",o:["التوجه بالعميل","اتخاذ القرار بناءً على المعلومات والحقائق","التحسين المستمر","الوقاية من الأخطاء"],a:1,e:"مبدأ اتخاذ القرار بناءً على المعلومات والحقائق يرفض القرارات الارتجالية غير المبنية على بيانات."},
{q:"ما الهدف من تعبئة خبرات القوى العاملة في TQM؟",o:["تقليل عدد الموظفين","استثمار معارف الموظفين لتطوير العمل وزيادة الأرباح","تشديد الرقابة على العاملين","تقليل برامج التدريب"],a:1,e:"الهدف استثمار المعلومات الهائلة لدى العاملين لتطوير العمل وزيادة الأرباح وتخفيض التكاليف."},
{q:"ما المرحلة التي اعتبرت فيها الجودة ميزة تنافسية للمرة الأولى؟",o:["الفحص والتفتيش","الرقابة الإحصائية","تأكيد الجودة","حلقات الجودة"],a:2,e:"في مرحلة تأكيد الجودة اعتُبرت الجودة ميزة تنافسية وسُعي إلى تحقيق مبدأ الإنتاج بدون أخطاء."},
{q:"أيٌّ من التالي صحيح بشأن مبدأ دعم الإدارة العليا؟",o:["الإدارة العليا تتخذ القرارات فقط دون مشاركة","يتوقف نجاح TQM على مدى قناعة الإدارة العليا","الإدارة العليا تراقب الموظفين فقط","الإدارة العليا توفر المال فقط"],a:1,e:"نجاح TQM يتوقف على مدى قناعة وإيمان الإدارة العليا بفوائد وضرورة TQM."},
{q:"ما التسلسل الصحيح لمراحل التطور التاريخي لإدارة الجودة؟",o:["TQM ثم حلقات ثم تأكيد ثم إحصائية ثم فحص","فحص ثم إحصائية ثم تأكيد ثم حلقات ثم TQM","حلقات ثم فحص ثم إحصائية ثم تأكيد ثم TQM","تأكيد ثم فحص ثم إحصائية ثم حلقات ثم TQM"],a:1,e:"التسلسل: الفحص والتفتيش ثم الرقابة الإحصائية ثم تأكيد الجودة ثم حلقات الجودة ثم TQM."},
{q:"ما المبدأ الذي يشمل التدريب وتطوير الكفاءات البشرية؟",o:["التوجه بالعميل","التحسين المستمر","تعبئة خبرات القوى العاملة","التغذية العكسية"],a:2,e:"مبدأ تعبئة خبرات القوى العاملة يشمل توفير المهارات وتدريبها وتطويرها وتحفيزها."},
{q:"مرحلة الفحص والتفتيش ظهرت مع:",o:["الثورة الرقمية","بدايات الثورة الصناعية في القرن الثامن عشر","الحرب العالمية الأولى","ظهور الحواسيب"],a:1,e:"مرحلة الفحص والتفتيش ظهرت مع بدايات الثورة الصناعية في القرن الثامن عشر."},
{q:"مبدأ التركيز على جودة العمليات يعني:",o:["الاقتصار على فحص النتائج","تقييم جودة الإدارة العليا فقط","تصميم العمليات لتعطي نتائج بلا أخطاء","تحسين جودة المنتج النهائي فقط"],a:2,e:"مبدأ التركيز على جودة العمليات يمتد لتشمل العمليات وتصميمها لتعطي نتائج بلا أخطاء."},
{q:"أيٌّ من التالي صحيح عن مرحلة حلقات الجودة؟",o:["برزت في أمريكا قبل اليابان","تضم 50 موظفاً على الأقل","جعلت الجودة مسؤولية جماعية يشترك فيها الجميع","كانت مرحلة الفحص النهائي"],a:2,e:"مرحلة حلقات الجودة جعلت الجودة مسؤولية جماعية يشترك فيها جميع العاملين."},
{q:"ما المبدأ الذي يضمن أن قرارات المنظمة ليست تكهنات؟",o:["المشاركة والعمل الجماعي","التوجه بالعميل","اتخاذ القرار بناءً على المعلومات والحقائق","دعم الإدارة العليا"],a:2,e:"مبدأ اتخاذ القرار بناءً على المعلومات والحقائق يضمن أن تكون القرارات دقيقة وليست تكهنات."},
{q:"أين برزت مرحلة حلقات الجودة؟",o:["أمريكا","ألمانيا","اليابان","بريطانيا"],a:2,e:"مرحلة حلقات الجودة برزت في اليابان حيث أصبحت الجودة مسؤولية جماعية لجميع العاملين."},
{q:"أيٌّ من التالي يُعبّر عن الوقاية من الأخطاء في TQM؟",o:["فحص المنتج النهائي قبل التسليم","مراقبة الانحرافات ومنع دخول المدخلات غير المطابقة","الاعتذار للعملاء عن الأخطاء","مكافأة العاملين على الإنتاج الكمي"],a:1,e:"الوقاية تعني إدخال عنصر الوقاية في العملية الإنتاجية ومراقبة الانحرافات قبل وقوعها."},
{q:"TQM استُخدمت في الدول العربية لـ:",o:["تقليد النموذج الأمريكي التقليدي","مواجهة التفوق الصناعي الياباني","تطوير الصناعة الحربية","تقليل الاعتماد على الموارد البشرية"],a:1,e:"استخدمت المؤسسات العربية TQM لمواجهة التفوق الصناعي الياباني مستفيدةً من التجربة اليابانية."},
{q:"في أي قرن ظهرت مرحلة الفحص والتفتيش؟",o:["القرن السادس عشر","القرن السابع عشر","القرن الثامن عشر","القرن العشرين"],a:2,e:"مرحلة الفحص والتفتيش ظهرت مع بدايات الثورة الصناعية في القرن الثامن عشر."},
{q:"ما عدد مبادئ TQM المذكورة في المحاضرة الثالثة؟",o:["5 مبادئ","7 مبادئ","8 مبادئ","10 مبادئ"],a:2,e:"المحاضرة الثالثة ذكرت 8 مبادئ رئيسية من مبادئ إدارة الجودة الشاملة."}
]},
3:{title:"المحاضرة الرابعة: فلسفة رواد TQM",
tf:[
{q:"عرّف كروسبي الجودة بأنها المطابقة للمواصفات Conformance to Requirements.",a:true,e:"صحيح، تعريف كروسبي للجودة: المطابقة للمواصفات."},
{q:"كروسبي اعتبر أن الجودة مكلفة لأن الوقاية تحتاج موارد ضخمة.",a:false,e:"كروسبي اعتبر أن الجودة مجانية (Quality is Free) لأن تكلفة الوقاية أقل من تكلفة الأخطاء."},
{q:"ديمنج اعتبر الربح هدفاً مباشراً لإدارة الجودة الشاملة.",a:false,e:"ديمنج رأى أن الربح نتيجة وليس هدفاً مباشراً؛ التحسين المستمر والجودة هما الهدف."},
{q:"إيشيكاوا ركّز على التدريب المستمر أثناء الخدمة باعتباره استثماراً طويل الأجل.",a:true,e:"صحيح، إيشيكاوا ركّز على التدريب المستمر أثناء الخدمة كاستثمار طويل الأجل."},
{q:"شوهارت طوّر الأساس العلمي لما عُرف لاحقاً بدورة ديمنج PDCA.",a:true,e:"صحيح، شوهارت وضع الأساس العلمي لدورة PDCA التي نسبها العالم لاحقاً لديمنج."},
{q:"ديمنج أكد على أهمية الفحص الشامل والتفتيش كأساس الجودة.",a:false,e:"ديمنج دعا إلى تقليل الاعتماد على التفتيش الشامل والتركيز على الوقاية بدلاً منه."},
{q:"إيشيكاوا رأى أن الجودة مسؤولية الإدارة فقط وليس العاملين.",a:false,e:"إيشيكاوا أكّد أن الجودة مسؤولية جميع العاملين وليست مسؤولية الإدارة فقط."},
{q:"شوهارت عمل في معامل Bell Telephone Laboratories.",a:true,e:"صحيح، شوهارت كان إحصائياً أمريكياً عمل في معامل Bell Telephone Laboratories."},
{q:"كروسبي شدّد على الوقاية بدل التفتيش لاكتشاف العيوب.",a:true,e:"صحيح، كروسبي شدّد على الوقاية من العيوب بدلاً من كشفها بعد الإنتاج."},
{q:"نشر شوهارت كتابه الشهير عام 1931 حول الرقابة الاقتصادية على جودة المنتجات.",a:true,e:"صحيح، نشر شوهارت عام 1931 كتابه حول الرقابة الاقتصادية على جودة المنتجات المصنعة."},
{q:"جوران رأى أن الجودة تحدث بالمصادفة وليست بحاجة لتخطيط.",a:false,e:"جوران اشتُهر بمقولته: الجودة لا تحدث بالمصادفة، بل يجب التخطيط لها."},
{q:"ديمنج لديه 14 مبدأ لإدارة الجودة.",a:true,e:"صحيح، لديمنج 14 مبدأً شهيراً لإدارة الجودة الشاملة."},
{q:"فلسفة شوهارت تركز على اكتشاف الأخطاء بعد الإنتاج.",a:false,e:"شوهارت ركّز على منع الأخطاء قبل وقوعها باستخدام الأساليب الإحصائية."},
{q:"جوران ربط الجودة بكفاءة الإدارة وأكد على دور الإدارة الوسطى.",a:true,e:"صحيح، جوران ربط الجودة بكفاءة الإدارة وشدّد على دور الإدارة الوسطى في قيادة جهود الجودة."},
{q:"إيشيكاوا أكّد على استخدام الأدوات الإحصائية المعقدة فقط في حل المشكلات.",a:false,e:"إيشيكاوا أكّد على استخدام الأدوات الإحصائية البسيطة في حل المشكلات، لا المعقدة فحسب."},
{q:"ديمنج أكّد على كسر الحواجز بين الإدارات كأحد مبادئه الـ14.",a:true,e:"صحيح، مبدأ كسر الحواجز بين الإدارات أحد المبادئ الـ14 لديمنج."},
{q:"إسهام كروسبي تمثل في تحويل الجودة إلى ثقافة وقائية تقوم على الالتزام الإداري.",a:true,e:"صحيح، إسهام كروسبي يتمثل في تحويل الجودة إلى ثقافة وقائية شاملة تقوم على الالتزام الإداري."},
{q:"جوران عمل في شركة Western Electric في مصانع Hawthorne.",a:true,e:"صحيح، جوران عمل في شركة Western Electric (Hawthorne)."},
{q:"ديمنج دعا إلى إنشاء نظم تدريب فعالة ومستدامة كأحد مبادئه.",a:true,e:"صحيح، هذا أحد المبادئ الـ14 لديمنج المتعلقة بالتعليم والتدريب المستمر."},
{q:"إيشيكاوا نظر إلى التفتيش النهائي بوصفه المحور الأساسي لضمان الجودة.",a:false,e:"إيشيكاوا دعا إلى التحول من التفتيش النهائي إلى تحسين العمليات الداخلية."},
{q:"كروسبي اعتبر معيار الأداء الوحيد المقبول هو الخلو التام من العيوب Zero Defects.",a:true,e:"صحيح، معيار الأداء عند كروسبي هو Zero Defects أي الخلو التام من العيوب."},
{q:"ديمنج في مبادئه دعا إلى رفع الحصص العددية وزيادة الكمية.",a:false,e:"ديمنج دعا إلى إلغاء الحصص العددية والتركيز على الجودة لا الكمية."},
{q:"جوران ساهم مع ديمنج في تطوير الصناعة اليابانية بعد الحرب العالمية الثانية.",a:true,e:"صحيح، كلا جوران وديمنج ساهما في تطوير الصناعة اليابانية بعد الحرب العالمية الثانية."},
{q:"شوهارت اهتم بدور العامل وتحفيزه على تحسين الأداء.",a:true,e:"صحيح، شوهارت اهتم بدور العامل وتحفيزه بدلاً من توجيه اللوم المستمر إليه."},
{q:"ديمنج رأى أن إزالة الخوف داخل المنظمة تحسّن الأداء.",a:true,e:"صحيح، إزالة الخوف داخل المنظمة أحد المبادئ الـ14 لديمنج."}
],
mc:[
{q:"عرّف كروسبي الجودة بأنها:",o:["الملاءمة للاستخدام","درجة التميز","المطابقة للمواصفات","رضا العميل الكامل"],a:2,e:"كروسبي عرّف الجودة بأنها Conformance to Requirements أي المطابقة للمواصفات."},
{q:"ما فلسفة كروسبي الجودة مجانية؟",o:["لا تكلفة للجودة أبداً","تكلفة الوقاية أقل من تكلفة الأخطاء","الجودة لا تحتاج استثمارات","الجودة مجانية بدون تدريب"],a:1,e:"الجودة مجانية تعني أن تكلفة الوقاية من الأخطاء أقل بكثير من تكلفة إصلاحها بعد حدوثها."},
{q:"أيٌّ من التالي أحد مبادئ ديمنج الـ14؟",o:["تقليل الاعتماد على العميل","الإبقاء على الحصص العددية","إزالة الخوف داخل المنظمة","زيادة التفتيش الشامل"],a:2,e:"إزالة الخوف داخل المنظمة أحد المبادئ الـ14 لديمنج لتحقيق أداء أفضل."},
{q:"ما يعنيه مبدأ ديمنج الربح نتيجة وليس هدفاً مباشراً؟",o:["لا أهمية للربح","التركيز على التحسين المستمر يؤدي تلقائياً إلى ربحية أعلى","يجب تجاهل الأهداف المالية","الجودة والربح لا يجتمعان"],a:1,e:"ديمنج رأى أن التركيز على التحسين والجودة يؤدي تلقائياً إلى ربحية أعلى."},
{q:"أين عمل شوهارت وما إسهامه؟",o:["عمل في Toyota ووضع نظام Kaizen","عمل في Bell Telephone ووضع الأساس العلمي لـ PDCA","عمل في Ford وطوّر Fishbone","عمل في IBM وطوّر ISO"],a:1,e:"شوهارت عمل في Bell Telephone Laboratories ووضع الأساس العلمي لما عُرف بدورة PDCA."},
{q:"ما معيار أداء كروسبي الوحيد المقبول؟",o:["تقليل العيوب إلى 1%","الخلو التام من العيوب Zero Defects","عيوب لا تتجاوز 5%","مستوى Sigma 3"],a:1,e:"كروسبي اعتبر أن معيار الأداء الوحيد المقبول هو الخلو التام من العيوب Zero Defects."},
{q:"ما فلسفة إيشيكاوا في الجودة؟",o:["الجودة مسؤولية المهندسين فقط","الجودة تتحقق بالفحص النهائي","الجودة مسؤولية جميع العاملين والعميل جزء من نظام الجودة","الجودة تعني مطابقة المواصفات"],a:2,e:"إيشيكاوا أكّد أن الجودة مسؤولية جميع العاملين، والعميل جزء أساسي من نظام الجودة."},
{q:"جوران اشتُهر بمقولته:",o:["الجودة مجانية","الجودة لا تحدث بالمصادفة، بل يجب التخطيط لها","العيوب الصفرية هي الهدف","الجودة هي رضا العميل"],a:1,e:"جوران اشتُهر بمقولته: الجودة لا تحدث بالمصادفة، بل يجب التخطيط لها."},
{q:"عرّف جوران الجودة بـ Fitness for Use، ما معناها؟",o:["المطابقة مع المواصفات","الملاءمة للاستخدام","التميز والتفوق","رضا العميل الكامل"],a:1,e:"Fitness for Use تعني الملاءمة للاستخدام، وهو تعريف جوران الشهير للجودة."},
{q:"ما الأداة الشهيرة التي طوّرها إيشيكاوا؟",o:["مخطط Gantt","مخطط Pareto","مخطط السبب والنتيجة Fishbone","خريطة التدفق"],a:2,e:"إيشيكاوا طوّر مخطط السبب والنتيجة (Fishbone Diagram) الشهير لتحليل الأسباب الجذرية."},
{q:"أيٌّ من التالي يمثل فلسفة شوهارت في الجودة؟",o:["الاعتماد على التفتيش النهائي","منع الأخطاء باستخدام الأساليب الإحصائية","تركيز الجودة في قسم الجودة فقط","الاعتذار عن الأخطاء بعد حدوثها"],a:1,e:"شوهارت ركّز على منع الأخطاء قبل وقوعها باستخدام الأساليب الإحصائية لتحليل العمليات."},
{q:"ثلاثية جوران للجودة تشمل:",o:["تخطيط، تصنيع، تسليم","تخطيط الجودة، رقابة الجودة، تحسين الجودة","الفحص، الرقابة، التصحيح","العميل، العملية، المنتج"],a:1,e:"ثلاثية جوران: Quality Planning وQuality Control وQuality Improvement."},
{q:"أيٌّ من مبادئ ديمنج الـ14 يتعلق بالعلاقات بين الأقسام؟",o:["توفير قيادة فعالة","كسر الحواجز بين الإدارات","وضع هدف دائم للتحسين","التخلص من الشعارات"],a:1,e:"مبدأ كسر الحواجز بين الإدارات يهدف إلى تعزيز التعاون الداخلي بين الأقسام."},
{q:"ما الإسهام الرئيسي لإيشيكاوا في TQM؟",o:["تطوير نظام ISO","تعميق البُعد الإنساني والمشاركة الجماعية وتطوير أدوات تحليل المشكلات","وضع مبادئ الـ14","تطوير دورة PDCA"],a:1,e:"إسهام إيشيكاوا يتمثل في تعميق البُعد الإنساني والمشاركة الجماعية وتطوير أدوات كـFishbone."},
{q:"فلسفة ديمنج في الجودة ترى أن الجودة:",o:["مسؤولية قسم الجودة فقط","مسؤولية إدارية شاملة والتحسين أساس التميز","أداة للفحص النهائي","مسؤولية المشترين"],a:1,e:"ديمنج رأى أن الجودة مسؤولية إدارية شاملة وليست وظيفة قسم معين، والتحسين المستمر أساس التميز."},
{q:"أيٌّ من التالي صحيح عن مساهمة كروسبي التطبيقية؟",o:["تطوير أدوات إحصائية معقدة","تصميم مقاييس جودة تناسب جميع أنشطة المؤسسة","تطوير دورة PDCA","تأسيس معامل Bell"],a:1,e:"كروسبي اشتُهر بتصميم مقاييس جودة تناسب جميع أنشطة المؤسسة بدءاً من مرحلة التصميم."},
{q:"ما الجامع بين جوران وديمنج؟",o:["كلاهما عمل في Bell Labs","كلاهما ساهم في تطوير الصناعة اليابانية بعد الحرب","كلاهما طوّر مخطط Fishbone","كلاهما أسّس ISO"],a:1,e:"كلا جوران وديمنج ساهما في تطوير الصناعة اليابانية بعد الحرب العالمية الثانية."},
{q:"ديمنج في مبدئه العمل الصحيح من أول مرة يقصد:",o:["سرعة الإنتاج","التركيز على الوقاية والإتقان لا إعادة الإنتاج","إنتاج كميات كبيرة","الاكتفاء بالتفتيش النهائي"],a:1,e:"العمل الصحيح من أول مرة يعني الإتقان والوقاية مما يلغي الحاجة لإعادة الإنتاج."},
{q:"ما الخاصية المشتركة بين فلسفتي كروسبي وشوهارت؟",o:["الاعتماد على التفتيش النهائي","الوقاية من الأخطاء قبل وقوعها","التركيز على رضا العميل فقط","تقديم الربح كهدف رئيسي"],a:1,e:"كلاهما ركّز على الوقاية من الأخطاء قبل حدوثها بدلاً من اكتشافها بعد الإنتاج."},
{q:"ما مفهوم جوران لدور الإدارة الوسطى في الجودة؟",o:["الإدارة الوسطى لا دور لها","الإدارة الوسطى قائدة لجهود الجودة مع دعم الإدارة العليا","الإدارة الوسطى مسؤولة عن التفتيش فقط","الإدارة الوسطى تتابع أهداف الإنتاج فقط"],a:1,e:"جوران أكّد على دور الإدارة الوسطى في قيادة جهود الجودة مع دعم وإشراف الإدارة العليا."},
{q:"أيٌّ من التالي يعكس مبدأ ديمنج تبنّي فلسفة إدارية جديدة يشترك فيها الجميع؟",o:["الإدارة العليا تتخذ القرارات وحدها","إشراك جميع مستويات المنظمة في تبني فلسفة الجودة","تخصيص قسم منفصل للجودة","الاكتفاء بتدريب مدراء الجودة"],a:1,e:"المبدأ الثاني من الـ14 يدعو لتبني فلسفة إدارية جديدة بمشاركة الجميع في كل المستويات."},
{q:"أيٌّ من التالي من أدوات الجودة التي طوّرها إيشيكاوا؟",o:["دورة PDCA","مخطط Gantt","أدوات الرقابة الإحصائية SPC ومخطط Fishbone","معايير ISO 9001"],a:2,e:"إيشيكاوا طوّر مخطط Fishbone وأدوات الرقابة الإحصائية SPC."},
{q:"ما شرط نجاح تطبيق الجودة وفق ديمنج؟",o:["شراء تقنيات حديثة فقط","إشراك جميع أفراد المنظمة في تطبيق الجودة","تعيين مدير جودة خارجي","تخفيض ميزانية الإنتاج"],a:1,e:"المبدأ 13 لديمنج: إشراك جميع أفراد المنظمة في تطبيق برنامج الجودة."},
{q:"ما الذي يميز فلسفة شوهارت عن غيره من الرواد؟",o:["أنه أوّل من استخدم دوائر الجودة","أنه المؤسس الحقيقي للرقابة الإحصائية على الجودة ووضع أساس PDCA","أنه أوّل من طوّر معايير ISO","أنه أوّل من طبّق TQM في اليابان"],a:1,e:"شوهارت يُعد المؤسس الحقيقي للرقابة الإحصائية على الجودة ووضع الأساس العلمي لدورة PDCA."},
{q:"أيٌّ من التالي يعكس تعريف جوران الذي يتكامل مع ثلاثيته؟",o:["الجودة مجانية","الجودة هي درجة التميز","الجودة ملاءمة للاستخدام مع تخطيط ورقابة وتحسين","الجودة صفر عيوب"],a:2,e:"جوران عرّف الجودة بالملاءمة للاستخدام وطوّر ثلاثيته (تخطيط ورقابة وتحسين) لتحقيقها."}
]},
4:{title:"المحاضرة الخامسة: أدوار وأهداف TQM",
tf:[
{q:"تعزيز رضا العملاء يعني فقط تقليل الأسعار.",a:false,e:"تعزيز رضا العملاء يعني تلبية احتياجاتهم وتجاوز توقعاتهم بتقديم منتجات وخدمات عالية الجودة."},
{q:"فلسفة Kaizen تهدف إلى التطوير التدريجي المستمر للأداء.",a:true,e:"صحيح، Kaizen فلسفة يابانية للتحسين المستمر والتدريجي للأداء وتقليل الأخطاء."},
{q:"مشاركة العاملين في TQM تقتصر على المديرين فقط.",a:false,e:"TQM تؤكد مشاركة جميع العاملين وليس المديرين فقط، بما فيهم تقديم الأفكار والمبادرات."},
{q:"تحسين الكفاءة التشغيلية يشمل تقليل الهدر في الموارد.",a:true,e:"صحيح، TQM تساعد في تقليل الهدر وتحسين استخدام الإمكانات لرفع الكفاءة التشغيلية."},
{q:"معيار ISO 9001 أحد المعايير الدولية للجودة المذكورة في المحاضرة.",a:true,e:"صحيح، ISO 9001 مذكور في المحاضرة كمثال على المعايير الدولية للجودة."},
{q:"TQM تُقلّل من ثقة العملاء بالمنظمة على المدى البعيد.",a:false,e:"TQM تزيد ثقة العملاء وولاءهم للمنظمة من خلال تقديم منتجات وخدمات عالية الجودة."},
{q:"دعم اتخاذ القرار في TQM يعتمد على البيانات والتحليل الإحصائي.",a:true,e:"صحيح، TQM تعتمد على البيانات والتحليل الإحصائي في تحديد أسباب المشكلات واتخاذ القرارات."},
{q:"تمكين العاملين في TQM يعني تشجيعهم على تقديم الأفكار والمبادرات.",a:true,e:"صحيح، تؤكد TQM أهمية تمكين العاملين وتشجيعهم على المشاركة والمبادرة."},
{q:"التحسين المستمر في TQM مسؤولية قسم الجودة فقط.",a:false,e:"التحسين المستمر في TQM مسؤولية جميع العاملين في كل المستويات، لا قسم الجودة وحده."},
{q:"رفع كفاءة العمليات التشغيلية يُحقق الالتزام بالمعايير الدولية.",a:true,e:"صحيح، رفع الكفاءة التشغيلية يسهم في الالتزام بالمعايير الدولية مثل ISO 9001."},
{q:"TQM لا تهتم بتحسين جودة القرارات الإدارية.",a:false,e:"من أهم أدوار TQM تحسين جودة القرارات الإدارية باستخدام البيانات والتحليل الإحصائي."},
{q:"ولاء العملاء للمنظمة يتحقق من خلال تلبية احتياجاتهم وتجاوز توقعاتهم.",a:true,e:"صحيح، ولاء العملاء يُبنى عبر تلبية احتياجاتهم وتجاوز توقعاتهم."},
{q:"Kaizen تعني التحسين الجذري والمفاجئ في أداء المنظمة.",a:false,e:"Kaizen تعني التحسين التدريجي المستمر لا الجذري المفاجئ."},
{q:"TQM تُقلّل من الهدر في الموارد وترفع الكفاءة.",a:true,e:"صحيح، TQM تساعد في تقليل الهدر وتحسين استخدام الموارد."},
{q:"قرارات TQM الإدارية تُبنى على التكهنات لا على البيانات.",a:false,e:"قرارات TQM تُبنى على البيانات والتحليل الإحصائي الدقيق، لا التكهنات."},
{q:"مشاركة العاملين في تحسين الجودة تزيد من كفاءة الأداء.",a:true,e:"صحيح، مشاركة العاملين وتقديمهم للأفكار والمبادرات يُطوّر العمل ويزيد كفاءة الأداء."},
{q:"من أهداف TQM تحقيق رضا العملاء وتعزيز ولاءهم.",a:true,e:"صحيح، تعزيز رضا وولاء العملاء من الأهداف الاستراتيجية الأساسية لإدارة الجودة الشاملة."},
{q:"تحليل أسباب المشكلات يعتمد في TQM على التحليل الإحصائي.",a:true,e:"صحيح، TQM تعتمد على التحليل الإحصائي في تحديد أسباب المشكلات وتطوير الحلول."},
{q:"TQM تهتم بتحسين العمليات الداخلية فقط دون الاهتمام بالعملاء.",a:false,e:"TQM تُوازن بين تحسين العمليات الداخلية وتعزيز رضا العملاء كلاهما هدف أساسي."},
{q:"تحسين الكفاءة التشغيلية يُقلّل التكاليف على المدى الطويل.",a:true,e:"صحيح، تحسين الكفاءة يقلل الهدر والأخطاء مما يُخفّض التكاليف على المدى الطويل."},
{q:"دعم اتخاذ القرار في TQM يساعد في اختيار أفضل الحلول للمشكلات.",a:true,e:"صحيح، استخدام البيانات والتحليل الإحصائي يحسّن جودة القرارات ويختار أفضل الحلول."},
{q:"الهدف من تعزيز مشاركة العاملين هو تقليل كلفة الرواتب.",a:false,e:"هدف مشاركة العاملين في TQM هو تطوير العمل وزيادة كفاءة الأداء، لا خفض الرواتب."},
{q:"ISO 9001 معيار دولي يُساعد على الالتزام بمستوى ثابت من الجودة.",a:true,e:"صحيح، ISO 9001 يضمن مستوى ثابتاً من الجودة في عمليات المنظمة."},
{q:"التحسين المستمر وفق Kaizen يُقلّل الأخطاء والعيوب بشكل تدريجي.",a:true,e:"صحيح، Kaizen تهدف إلى التحسين التدريجي المستمر وتقليل الأخطاء والعيوب."},
{q:"TQM تعزز ثقة العملاء بالمنظمة من خلال الجودة المستمرة.",a:true,e:"صحيح، الجودة المستمرة تُعزز ثقة العملاء وتزيد ولاءهم للمنظمة."}
],
mc:[
{q:"ما الدور الأول لإدارة الجودة الشاملة المذكور في المحاضرة؟",o:["تحسين الكفاءة التشغيلية","تعزيز رضا العملاء","دعم اتخاذ القرار","مشاركة وتمكين العاملين"],a:1,e:"الدور الأول المذكور في المحاضرة هو تعزيز رضا العملاء."},
{q:"فلسفة Kaizen تهدف إلى:",o:["تحقيق أرباح سريعة","التطوير التدريجي المستمر للأداء وتقليل الأخطاء","تقليل عدد الموظفين","تسريع الإنتاج على حساب الجودة"],a:1,e:"Kaizen تهدف إلى التطوير التدريجي المستمر للأداء وتقليل الأخطاء والعيوب."},
{q:"ما الهدف من مشاركة وتمكين العاملين في TQM؟",o:["تقليل رواتب الموظفين","تطوير العمل وزيادة كفاءة الأداء من خلال أفكار ومبادرات العاملين","تشديد الرقابة على العاملين","تقليل عدد المستويات الإدارية"],a:1,e:"TQM تشجع العاملين على تقديم أفكار ومبادرات تُطوّر العمل وتزيد كفاءة الأداء."},
{q:"ما معيار الجودة الدولي المذكور في المحاضرة؟",o:["ISO 14001","ISO 45001","ISO 9001","ISO 27001"],a:2,e:"ISO 9001 هو معيار الجودة الدولي المذكور في المحاضرة الخامسة."},
{q:"كيف تدعم TQM اتخاذ القرارات الإدارية؟",o:["بالخبرة الشخصية للمديرين","بزيادة عدد الاجتماعات","باستخدام البيانات والتحليل الإحصائي","بتقليص صلاحيات المديرين"],a:2,e:"TQM تعتمد على البيانات والتحليل الإحصائي لتحديد أسباب المشكلات وتحسين جودة القرارات."},
{q:"ما النتيجة المباشرة لتعزيز رضا العملاء في TQM؟",o:["تقليل الإنتاج","زيادة ثقة العملاء وولاءهم للمنظمة","رفع أسعار المنتجات","خفض تكاليف التشغيل فوراً"],a:1,e:"تعزيز رضا العملاء يؤدي إلى زيادة ثقتهم وولاءهم للمنظمة على المدى الطويل."},
{q:"ما الدور المرتبط بتقليل الهدر في الموارد في TQM؟",o:["تعزيز رضا العملاء","التحسين المستمر","تحسين الكفاءة التشغيلية","دعم اتخاذ القرار"],a:2,e:"دور تحسين الكفاءة التشغيلية يشمل تقليل الهدر في الموارد وتحسين استخدام الإمكانات."},
{q:"ما الهدف من التحسين المستمر للعمليات في TQM؟",o:["تقليل عدد العاملين","تطوير الأداء وتقليل الأخطاء بشكل تدريجي مستمر","زيادة حجم الإنتاج الكمي","تسريع تقديم المنتجات بأقل جودة"],a:1,e:"التحسين المستمر يهدف إلى تطوير الأداء وتقليل الأخطاء والعيوب بشكل تدريجي ودائم."},
{q:"ما التوصيف الصحيح لأهمية ISO 9001 في TQM؟",o:["معيار للسلامة المهنية فقط","معيار بيئي","معيار يضمن مستوى ثابتاً من الجودة في العمليات","معيار لإدارة الموارد البشرية"],a:2,e:"ISO 9001 معيار الجودة الذي يضمن مستوى ثابتاً من الجودة في العمليات التشغيلية."},
{q:"أيٌّ من التالي مثال على دعم اتخاذ القرار في TQM؟",o:["اتخاذ قرار بناءً على تجربة المدير الشخصية","استخدام بيانات معدل العيوب لتحديد سبب مشكلة وحلها","الاعتماد على آراء العملاء الشفهية غير الموثقة","اتخاذ قرار تقليل الميزانية دون تحليل"],a:1,e:"استخدام البيانات مثال نموذجي على دعم اتخاذ القرار في TQM."},
{q:"ما العلاقة بين TQM ومعايير ISO؟",o:["TQM تتعارض مع ISO","TQM تُرسّخ الالتزام بمعايير ISO للجودة","ISO تُلغي الحاجة لـ TQM","لا علاقة بينهما"],a:1,e:"TQM ترفع كفاءة العمليات وتُرسّخ الالتزام بمعايير الجودة الدولية كـ ISO 9001."},
{q:"ما الذي يميز تمكين العاملين في TQM عن الإدارة التقليدية؟",o:["التمكين يعني إعطاء صلاحيات مالية","التمكين يشجع المشاركة والمبادرة وتقديم الأفكار لتحسين الجودة","التمكين يعني ترقية العاملين","التمكين يعني تقليل الرقابة عليهم"],a:1,e:"تمكين العاملين في TQM يعني تشجيعهم على المشاركة الفعلية وتقديم أفكار تُحسّن الجودة."},
{q:"أيٌّ من التالي ليس دوراً من أدوار TQM الخمسة المذكورة في المحاضرة؟",o:["تعزيز رضا العملاء","التحسين المستمر للعمليات","زيادة حجم العمالة","دعم اتخاذ القرار"],a:2,e:"الأدوار الخمسة المذكورة: رضا العملاء، التحسين المستمر، مشاركة العاملين، الكفاءة التشغيلية، دعم القرار."},
{q:"كيف تُعزز TQM الميزة التنافسية للمنظمة؟",o:["بتخفيض الأسعار فقط","بتقليل عدد المنتجات","بتحسين جودة المنتجات والخدمات مما يزيد ثقة العملاء وولاءهم","بالاستثمار في الإعلانات فقط"],a:2,e:"TQM تُعزز الميزة التنافسية بتحسين جودة المنتجات والخدمات مما يزيد ثقة العملاء وولاءهم."},
{q:"ما معنى الكفاءة التشغيلية في سياق TQM؟",o:["زيادة عدد ساعات العمل","إنتاج أكبر كمية ممكنة","تقليل الهدر وتحسين استخدام الإمكانات لرفع جودة العمليات","تقليل تكاليف الرواتب"],a:2,e:"الكفاءة التشغيلية في TQM تعني تقليل الهدر وتحسين استخدام الموارد والإمكانات المتاحة."},
{q:"أيٌّ من التالي مثال على التحسين المستمر Kaizen في المستشفيات؟",o:["رفع أسعار الخدمات","تقليل عدد الأطباء","تطوير إجراءات العلاج تدريجياً لتقليل أخطاء الطبابة","بناء مستشفيات جديدة"],a:2,e:"تطوير إجراءات العلاج تدريجياً لتقليل الأخطاء مثال نموذجي على Kaizen في قطاع الصحة."},
{q:"ما أثر دعم اتخاذ القرار الجيد على جودة منتجات المنظمة؟",o:["لا أثر مباشر","يُحسّن جودة المنتجات بتحديد أسباب المشكلات وحلها بدقة","يُقلّل الإنتاج الكمي","يرفع تكاليف الإنتاج"],a:1,e:"القرارات المبنية على بيانات دقيقة تُحدد أسباب المشكلات وتحلها بدقة مما يُحسّن الجودة."},
{q:"أيٌّ من التالي يُعبّر عن مبدأ تحسين الكفاءة التشغيلية في TQM؟",o:["رفع أجور الموظفين","تقليل الهدر في المواد والوقت والجهد وتحسين العمليات","زيادة عدد العاملين","شراء معدات إنتاج أكبر"],a:1,e:"تحسين الكفاءة التشغيلية يعني تقليل الهدر في الموارد وتحسين استخدام الإمكانات المتاحة."},
{q:"أيٌّ من التالي ليس هدفاً لمشاركة العاملين في TQM؟",o:["تطوير العمل من خلال أفكار العاملين","زيادة كفاءة الأداء","تعزيز الشعور بالانتماء","إلغاء دور الإدارة العليا"],a:3,e:"مشاركة العاملين تعزز دور الجميع بما فيهم الإدارة العليا، ولا تلغي دور أي طرف."},
{q:"ما الذي تقيسه البيانات والتحليل الإحصائي في TQM؟",o:["الرواتب والأجور","أسباب المشكلات ومعدلات العيوب ومستويات رضا العملاء","أهداف المبيعات فقط","عدد الموظفين في كل قسم"],a:1,e:"البيانات والتحليل الإحصائي في TQM تقيس أسباب المشكلات ومعدلات العيوب ومستويات رضا العملاء."},
{q:"كيف يتجلى دور TQM في الالتزام بالمعايير الدولية؟",o:["بالحصول على شهادات شرفية","برفع مستوى الكفاءة التشغيلية والالتزام بمتطلبات ISO","بالإعلان عن الالتزام دون تطبيق","بشراء معدات حديثة"],a:1,e:"TQM ترفع الكفاءة التشغيلية وتُرسّخ الالتزام بمتطلبات معايير الجودة الدولية مثل ISO 9001."},
{q:"أيٌّ من التالي مثال على تعزيز رضا العملاء في مطعم؟",o:["رفع أسعار الوجبات","توحيد جودة الطعام والاهتمام بشكاوى الزبائن وسرعة الخدمة","تقليل عدد الأطباق المقدمة","إغلاق المطعم في أوقات الذروة"],a:1,e:"توحيد الجودة والاهتمام بالشكاوى وسرعة الخدمة تُعزز رضا العملاء في قطاع المطاعم."},
{q:"لماذا تُعدّ Kaizen مناسبة لجميع أنواع المنظمات؟",o:["لأنها تتطلب موارد مالية ضخمة","لأن تحسينها تدريجي ومستمر يناسب أي حجم وأي نوع من المنظمات","لأنها مرتبطة باليابان فقط","لأنها تتطلب تقنيات متقدمة"],a:1,e:"Kaizen تُناسب جميع المنظمات لأن طابعها تدريجي ومستمر لا يحتاج ثورة مفاجئة."},
{q:"ما الهدف الاستراتيجي من تحسين الكفاءة التشغيلية في TQM؟",o:["تقليل عدد المنتجات","رفع مستوى الجودة وتقليل التكاليف وتحقيق الالتزام بالمعايير الدولية","زيادة ساعات العمل","التركيز على سوق محلي فقط"],a:1,e:"تحسين الكفاءة التشغيلية يرفع الجودة ويقلل التكاليف ويُحقق الالتزام بالمعايير الدولية."},
{q:"أيٌّ من التالي صحيح عن أدوار TQM الخمسة؟",o:["هي غير مترابطة وكل دور مستقل","هي متكاملة ومترابطة وتصب في هدف تحسين الأداء ورضا العملاء","لا تشمل دعم اتخاذ القرار","تقتصر على الإنتاج الصناعي فقط"],a:1,e:"الأدوار الخمسة لـ TQM متكاملة ومترابطة، وكلها تصب في تحسين الأداء المؤسسي ورضا العملاء."}
]},
5:{title:"المحاضرة السادسة: استراتيجية الجودة وضبطها وعولمتها",
tf:[
{q:"أول خطوة في تطبيق الجودة هي اقتناع الإدارة بفوائدها.",a:true,e:"صحيح، اقتناع المسؤولين في الإدارة بفوائد نظم الجودة هو الخطوة الأولى المذكورة في المحاضرة."},
{q:"الرقابة الأمامية تتم بعد الانتهاء من تصنيع المنتجات.",a:false,e:"الرقابة الأمامية القبلية تمنع دخول مدخلات غير مطابقة قبل بدء الإنتاج وليس بعده."},
{q:"ضبط الجودة يشمل ثلاثة أنواع: أمامية وحالية وخلفية.",a:true,e:"صحيح، ضبط الجودة يتحقق بمجموع الرقابة الأمامية والحالية والخلفية."},
{q:"تكاليف الوقاية تهدف إلى اكتشاف العيوب أثناء الإنتاج.",a:false,e:"تكاليف الوقاية تهدف إلى منع حدوث الأخطاء قبل وقوعها، أما اكتشاف العيوب فهو هدف تكاليف التقييم."},
{q:"عولمة TQM تُمكّن المنظمات من التميز في الأسواق العالمية.",a:true,e:"صحيح، عولمة TQM تُمكّن المنظمات من التميز التنافسي في الأسواق العالمية."},
{q:"تكاليف الإخفاق الخارجي تشمل شكاوى العملاء والضمانات والتعويضات.",a:true,e:"صحيح، الإخفاق الخارجي يشمل العيوب التي ظهرت بعد وصول المنتج للعميل كالشكاوى والضمانات."},
{q:"الخطوة الأولى في الخطة الاستراتيجية هي تحديد المشكلات الداخلية مباشرةً.",a:false,e:"الخطوة الأولى هي تهيئة الأجواء وخلق ثقافة جديدة، ثم تطوير الرسالة، ثم التعرف على المشكلات."},
{q:"تكاليف المطابقة تنقسم إلى تكاليف وقاية وتكاليف تقييم.",a:true,e:"صحيح، تكاليف المطابقة تشمل تكاليف الوقاية وتكاليف التقييم."},
{q:"الرقابة الحالية تتم على خطوط الإنتاج لدى الانتقال من عملية لأخرى.",a:true,e:"صحيح، الرقابة الحالية تنصبّ على خطوط الإنتاج خاصةً عند الانتقال بين العمليات."},
{q:"تحقيق رضا العملاء العالمي من فوائد عولمة TQM.",a:true,e:"صحيح، عولمة TQM تُساعد على تلبية احتياجات العملاء في بيئات وأسواق متنوعة."},
{q:"تكلفة الإخفاق الداخلي تشمل عيوباً ظهرت بعد وصول المنتج للعميل.",a:false,e:"الإخفاق الداخلي يشمل عيوباً اكتُشفت داخل المصنع قبل وصول المنتج للعميل."},
{q:"تكاليف عدم المطابقة تشمل الإخفاق الداخلي والخارجي.",a:true,e:"صحيح، تكاليف عدم المطابقة تنقسم إلى إخفاق داخلي وإخفاق خارجي."},
{q:"مبدأ التحسين المستمر Kaizen أحد مبادئ عولمة إدارة الجودة الشاملة.",a:true,e:"صحيح، Kaizen أحد المبادئ الأساسية لعولمة إدارة الجودة الشاملة."},
{q:"ارتفاع تكاليف التطبيق من تحديات عولمة TQM.",a:true,e:"صحيح، ارتفاع تكاليف التطبيق والتدريب من أبرز تحديات عولمة TQM."},
{q:"الأساس الخامس لضبط الجودة هو تحديد مستويات الجودة المطلوبة.",a:false,e:"الأساس الخامس هو اتخاذ الإجراءات التصحيحية والوقائية، أما تحديد مستويات الجودة فهو الأساس الأول."},
{q:"توحيد المعايير الدولية كـ ISO من فوائد عولمة TQM.",a:true,e:"صحيح، تطبيق معايير ISO يضمن مستوى ثابتاً من الجودة كأحد فوائد عولمة TQM."},
{q:"شركة Toyota مثال على تطبيق TQM عالمياً من خلال فلسفة Kaizen.",a:true,e:"صحيح، Toyota نموذج عالمي بارز في تطبيق TQM وفلسفة Kaizen."},
{q:"مقاومة التغيير من قِبَل العاملين من تحديات عولمة TQM.",a:true,e:"صحيح، مقاومة التغيير من قِبَل العاملين أحد التحديات الرئيسية لعولمة TQM."},
{q:"تكاليف التقييم تشمل فحص المواد الخام واختبارات الجودة.",a:true,e:"صحيح، تكاليف التقييم تشمل فحص المواد الخام والتفتيش أثناء الإنتاج واختبارات الجودة."},
{q:"تهيئة الأجواء في الخطة الاستراتيجية تشمل تغيير ثقافة المنظمة وإشراك العاملين.",a:true,e:"صحيح، تهيئة الأجواء تعني خلق ثقافة جديدة من خلال إشراك العاملين ووضع برامج تدريب جديدة."},
{q:"ضبط الجودة يعتمد فقط على الفحص البصري للمنتجات النهائية.",a:false,e:"ضبط الجودة يعتمد على الطرق والأدوات الإحصائية ولا يقتصر على الفحص البصري."},
{q:"التخطيط الاستراتيجي للجودة يأخذ بعين الاعتبار طبيعة عمل المنظمة.",a:true,e:"صحيح، التخطيط الاستراتيجي للجودة يُحدد الأهداف طويلة الأمد مع مراعاة طبيعة عمل المنظمة."},
{q:"التباين الثقافي بين الدول يُسهّل تطبيق نموذج جودة موحد.",a:false,e:"التباين الثقافي يُصعّب تطبيق نموذج موحد، وهو من تحديات عولمة TQM."},
{q:"مقارنة القياسات الفعلية بالمواصفات المحددة أحد الأسس الخمسة لضبط الجودة.",a:true,e:"صحيح، مقارنة القياسات الفعلية بالمواصفات هو الأساس الثالث من أسس ضبط الجودة."},
{q:"عولمة TQM تشير إلى تبنّي معايير وممارسات جودة موحدة ذات طابع عالمي.",a:true,e:"صحيح، هذا هو التعريف الدقيق لعولمة إدارة الجودة الشاملة المذكور في المحاضرة."}
],
mc:[
{q:"ما الخطوة الأولى في استراتيجية تطبيق الجودة؟",o:["تكوين فرق الجودة","البدء بالتطبيق الفوري","اقتناع المسؤولين في الإدارة بفوائد نظم الجودة","تحديد المسؤوليات"],a:2,e:"الخطوة الأولى هي اقتناع المسؤولين في الإدارة بفوائد وأهمية تطبيق نظم الجودة."},
{q:"أيٌّ من التالي يمثل الرقابة الأمامية في ضبط الجودة؟",o:["فحص المنتج النهائي قبل التسليم","الرقابة على خطوط الإنتاج","منع دخول المدخلات غير المطابقة للمواصفات","إصلاح العيوب بعد اكتشافها"],a:2,e:"الرقابة الأمامية القبلية تمنع دخول المدخلات غير المطابقة للمواصفات قبل دخولها الإنتاج."},
{q:"ما تكاليف الوقاية في ضبط الجودة؟",o:["تكاليف إصلاح المنتجات المعيبة","تكاليف شكاوى العملاء","تكاليف تخطيط وتصميم الجودة والتدريب وتحسين العمليات","تكاليف فحص المنتج النهائي"],a:2,e:"تكاليف الوقاية تشمل تخطيط الجودة والتدريب وتحسين العمليات والتأكد من جودة الموردين."},
{q:"ما التعريف الصحيح لعولمة TQM؟",o:["تصدير منتجات لدول أجنبية","تبنّي معايير جودة موحدة عالمياً لتحسين الأداء وتعزيز التنافسية","تطبيق TQM في الشركات متعددة الجنسيات فقط","الاستيراد من دول متقدمة"],a:1,e:"عولمة TQM هي تبنّي المنظمات لمعايير وممارسات جودة موحدة ذات طابع عالمي."},
{q:"ما الإخفاق الخارجي في تكاليف عدم المطابقة؟",o:["عيوب اكتُشفت داخل المصنع","إعادة تشغيل منتجات تالفة","عيوب ظهرت بعد وصول المنتج للعميل كشكاوى وتعويضات","تكاليف تدريب العاملين"],a:2,e:"الإخفاق الخارجي هو العيوب التي تظهر بعد وصول المنتج للعميل: شكاوى واستبدال وضمانات وتعويضات."},
{q:"أيٌّ من التالي يمثل الأساس الثاني من أسس ضبط الجودة؟",o:["اتخاذ الإجراءات التصحيحية","مقارنة القياسات بالمواصفات","قياس خصائص الجودة للمنتج بأخذ عينات","تحديد مستويات الجودة المطلوبة"],a:2,e:"الأساس الثاني هو قياس خصائص الجودة للمنتج بأخذ عينات منتظمة من خط الإنتاج."},
{q:"من فوائد عولمة TQM:",o:["زيادة التكاليف طويلة الأمد","تحقيق الميزة التنافسية وتلبية احتياجات العملاء العالميين","تقليل جودة المنتجات في الأسواق المحلية","إهمال المعايير الدولية"],a:1,e:"فوائد عولمة TQM: الميزة التنافسية، رضا العملاء العالمي، خفض التكاليف، توحيد المعايير."},
{q:"ما الخطوة الثانية في الخطة الاستراتيجية للجودة؟",o:["البدء الفعلي بالتطبيق","تهيئة الأجواء","تطوير رسالة المنظمة وإيضاح أهدافها","تحديد المشكلات الداخلية"],a:2,e:"الخطوة الثانية هي تطوير رسالة المنظمة وإيضاح أهدافها للحصول على الدعم المعنوي والمادي."},
{q:"ما الأساس الخامس من أسس ضبط الجودة؟",o:["تحديد مستويات الجودة","قياس خصائص المنتج","مقارنة الأداء بالمواصفات","اتخاذ الإجراءات التصحيحية والوقائية"],a:3,e:"الأساس الخامس هو اتخاذ الإجراءات التصحيحية والوقائية لعدم المطابقة الحادثة."},
{q:"أيٌّ من التالي من تحديات عولمة TQM؟",o:["سهولة التطبيق في جميع البيئات","انعدام الحاجة للتدريب","ارتفاع تكاليف التطبيق ومقاومة التغيير والتباين الثقافي","توفر موارد كافية دائماً"],a:2,e:"تحديات عولمة TQM: ارتفاع التكاليف، مقاومة التغيير، الحاجة لبنية تنظيمية قوية، التباين الثقافي."},
{q:"ما نوع التكاليف الذي يشمل فحص المواد الخام؟",o:["تكاليف الوقاية","تكاليف الإخفاق الداخلي","تكاليف التقييم","تكاليف الإخفاق الخارجي"],a:2,e:"فحص المواد الخام أثناء الإنتاج مثال على تكاليف التقييم ضمن تكاليف المطابقة."},
{q:"ما مبدأ عولمة TQM المتعلق بتحليل البيانات؟",o:["الالتزام الإداري","التركيز على العميل","اتخاذ القرارات المبنية على البيانات","مشاركة العاملين"],a:2,e:"مبدأ اتخاذ القرارات المبنية على البيانات يعني استخدام الأدوات الإحصائية في صنع القرار."},
{q:"ما الفرق بين تكاليف المطابقة وتكاليف عدم المطابقة؟",o:["لا فرق بينهما","المطابقة تكاليف وقاية وتقييم، عدم المطابقة تكاليف إخفاق داخلي وخارجي","المطابقة أعلى تكلفة دائماً","عدم المطابقة يشمل التدريب فقط"],a:1,e:"تكاليف المطابقة (وقاية + تقييم)؛ تكاليف عدم المطابقة (إخفاق داخلي + خارجي) بسبب العيوب."},
{q:"شركة Toyota مثال على عولمة TQM لأنها:",o:["أكبر شركة سيارات","استخدمت Kaizen لتحقيق جودة وكفاءة عالية على مستوى عالمي","تأسست في أمريكا","متخصصة في الإلكترونيات"],a:1,e:"Toyota نموذج عالمي بارز في TQM لاعتمادها على Kaizen لتحقيق مستويات عالية من الجودة."},
{q:"ما خطوات الخطة الاستراتيجية الأربع بالترتيب الصحيح؟",o:["تحديد المشكلات ثم الرسالة ثم التهيئة ثم الاستراتيجية","تهيئة الأجواء ثم تطوير الرسالة ثم التعرف على المشكلات ثم تطوير الاستراتيجية الشاملة","الاستراتيجية ثم التهيئة ثم الرسالة ثم المشكلات","الرسالة ثم المشكلات ثم الاستراتيجية ثم التهيئة"],a:1,e:"الترتيب: تهيئة الأجواء ثم تطوير الرسالة ثم التعرف على المشكلات الداخلية ثم تطوير الاستراتيجية."},
{q:"ما المقصود بتهيئة الأجواء في الخطة الاستراتيجية؟",o:["تكييف مبنى المنظمة","خلق ثقافة جودة جديدة بإشراك العاملين ووضع برامج تدريب مناسبة","شراء أجهزة الرقابة","تعيين مدير جودة خارجي"],a:1,e:"تهيئة الأجواء تعني خلق ثقافة وجو عمل جديد من خلال إشراك العاملين والتدريب وتغيير الثقافة."},
{q:"ما هدف الرقابة الخلفية البعدية في ضبط الجودة؟",o:["منع دخول مواد غير مطابقة","مراقبة خطوط الإنتاج الجارية","التأكد من مطابقة المنتجات النهائية للمواصفات","تدريب العاملين الجدد"],a:2,e:"الرقابة الخلفية تتم بعد الانتهاء من التصنيع للتأكد من مطابقة المنتجات للمواصفات الفنية."},
{q:"ما الفائدة الاقتصادية المباشرة لعولمة TQM؟",o:["رفع أسعار المنتجات","خفض التكاليف وزيادة الكفاءة بتقليل الأخطاء والهدر","زيادة عدد المنتجات الرديئة","رفع رواتب الإدارة العليا"],a:1,e:"عولمة TQM توفر خفض التكاليف وزيادة الكفاءة من خلال تقليل الأخطاء والهدر وتحسين العمليات."},
{q:"أيٌّ من التالي مثال على تكاليف الإخفاق الداخلي؟",o:["شكاوى العملاء","استبدال المنتجات التالفة عند العملاء","إعادة تشغيل منتجات تالفة داخل المصنع قبل التسليم","دفع تعويضات للعملاء"],a:2,e:"إعادة تشغيل المنتجات التالفة داخل المصنع قبل وصولها للعميل مثال على الإخفاق الداخلي."},
{q:"ما مبدأ عولمة TQM الأول المتعلق بالإدارة؟",o:["مشاركة العاملين","التحسين المستمر","الالتزام الإداري ودعم الإدارة العليا لثقافة الجودة","اتخاذ القرارات البيانية"],a:2,e:"المبدأ الأول هو الالتزام الإداري أي ضرورة دعم الإدارة العليا لثقافة الجودة والتحسين المستمر."},
{q:"أيٌّ من التالي ليس من أسس ضبط الجودة الخمسة؟",o:["تحديد مستويات الجودة","قياس خصائص الجودة","مقارنة القياسات بالمواصفات","اختيار أفضل مورد بالمزايدة"],a:3,e:"الأسس الخمسة لضبط الجودة: تحديد المستويات، القياس، المقارنة، تقييم الفروق، الإجراءات التصحيحية."},
{q:"أيٌّ من التالي مثال على تكاليف الوقاية؟",o:["فحص المواد الخام","شكاوى العملاء","تدريب العاملين على تحسين العمليات وتخطيط الجودة","إعادة تشغيل المنتجات المعيبة"],a:2,e:"تدريب العاملين وتخطيط الجودة مثال على تكاليف الوقاية التي تهدف لمنع حدوث الأخطاء."},
{q:"ما معيار الجودة الدولي الذي يضمن مستوى ثابتاً بغض النظر عن موقع الإنتاج؟",o:["ISO 14001","ISO 45001","ISO 9001","ISO 31000"],a:2,e:"ISO 9001 يضمن مستوى ثابتاً من الجودة بغض النظر عن موقع الإنتاج وهو المذكور في المحاضرة."},
{q:"ما الذي يوفره التخطيط الاستراتيجي الجيد للجودة؟",o:["تقليل الأهداف","أهداف رئيسية طويلة الأمد مع مراعاة طبيعة عمل المنظمة","أهداف قصيرة المدى فقط","التركيز على الإنتاج فقط"],a:1,e:"التخطيط الاستراتيجي للجودة يضع أهدافاً رئيسية طويلة الأمد مع مراعاة طبيعة عمل المنظمة."}
]},
6:{title:"المحاضرة السابعة: CRM وعلاقته بـ TQM",
tf:[
{q:"يمكن اعتبار CRM أداة استراتيجية لترجمة مبادئ TQM إلى ممارسات تشغيلية.",a:true,e:"صحيح، CRM يُترجم مبادئ TQM إلى ممارسات تشغيلية ملموسة تُحسّن علاقة المؤسسة بعملائها."},
{q:"CRM وTQM يهدفان معاً إلى تحقيق رضا العميل وتعزيز الولاء.",a:true,e:"صحيح، كلا النظامين متكاملان ويهدفان إلى رضا العميل وتعزيز الولاء على المدى الطويل."},
{q:"CRM التشغيلي يركز على تحليل البيانات التاريخية لاستخراج الأنماط.",a:false,e:"CRM التشغيلي يركز على كفاءة الواجهة الأمامية (مبيعات وتسويق وخدمة). أما تحليل البيانات فهو CRM التحليلي."},
{q:"CRM التحليلي يُعدّ العقل التحليلي للنظام ويعتمد على Data Mining.",a:true,e:"صحيح، CRM التحليلي يُحلّل البيانات التاريخية ويستخرج الأنماط السلوكية لتحويلها إلى رؤى."},
{q:"CRM التعاوني يكسر الحواجز بين الإدارات ويُتيح مشاركة المعلومات.",a:true,e:"صحيح، CRM التعاوني يركز على كسر الحواجز بين الأقسام وإتاحة تدفق المعلومات بسلاسة."},
{q:"الاستبقاء Retention يهدف إلى زيادة حجم المبيعات باستهداف عملاء جدد.",a:false,e:"Retention يهدف إلى الحفاظ على العملاء الحاليين وتقليل معدلات الفقد. زيادة المبيعات هي هدف النمو Growth."},
{q:"CRM الاستراتيجي يرتبط بالرؤية والرسالة وبناء ثقافة تتمحور حول العميل.",a:true,e:"صحيح، CRM الاستراتيجي يهدف إلى بناء ثقافة مؤسسية تتمحور حول العميل مرتبطة بالرؤية والرسالة."},
{q:"التكامل بين CRM وTQM يعني أن CRM يجمع البيانات وTQM يستخدمها لتحسين العمليات.",a:true,e:"صحيح، هذه هي فكرة التكامل: CRM يجمع ويحلل بيانات العملاء وTQM يستخدم هذه البيانات لتحسين الجودة."},
{q:"النمو Growth في CRM يعني الحفاظ على العملاء الحاليين فقط.",a:false,e:"النمو Growth يعني زيادة حجم المبيعات وتحسين الربحية باستهداف دقيق للجمهور، لا الحفاظ على العملاء فحسب."},
{q:"CRM مجرد برنامج تقني وليس عملية استراتيجية.",a:false,e:"CRM عملية استراتيجية شاملة وليست مجرد برنامج تقني؛ تهدف لفهم احتياجات العملاء وتوقعاتهم."},
{q:"CRM التشغيلي يشمل المبيعات والتسويق وخدمة العملاء.",a:true,e:"صحيح، CRM التشغيلي يركز على الواجهة الأمامية ويشمل المبيعات والتسويق وخدمة العملاء."},
{q:"يجب تحديد الأهداف التجارية قبل اختيار برنامج CRM.",a:true,e:"صحيح، قاعدة النجاح الأولى: الاستراتيجية قبل التقنية، أي تحديد الأهداف التجارية قبل اختيار البرنامج."},
{q:"جودة البيانات في CRM تعني تخزين أكبر قدر ممكن من البيانات بلا استثناء.",a:false,e:"جودة البيانات تعني التركيز على البيانات المفيدة وتجنب إهدار الموارد في تخزين بيانات غير ضرورية."},
{q:"تكامل CRM مع TQM يعزز الميزة التنافسية المستدامة.",a:true,e:"صحيح، تكامل CRM مع TQM يضمن تحويل احتياجات العملاء إلى حلول مبتكرة وميزة تنافسية مستدامة."},
{q:"يجب البدء بمشاريع تجريبية Pilot عند تنفيذ مشروع CRM.",a:true,e:"صحيح، التدرج في التنفيذ والبدء بمشاريع تجريبية قابلة للقياس من قواعد نجاح CRM."},
{q:"CRM التعاوني يشمل التسويق والإنتاج وخدمة العملاء والموردين والموزعين.",a:true,e:"صحيح، CRM التعاوني يُتيح مشاركة المعلومات بين التسويق والإنتاج وخدمة العملاء والموردين."},
{q:"يعمل CRM كجهاز استشعار للسوق بينما تعمل TQM كآلية للتنفيذ والتحسين.",a:true,e:"صحيح، CRM يستشعر احتياجات السوق والعملاء، وTQM تُنفّذها وتُحسّن العمليات لتلبيتها."},
{q:"قابلية التوسع في CRM تعني اختيار بنية تحتية تستوعب نمو البيانات.",a:true,e:"صحيح، قابلية التوسع تعني اختيار بنية تحتية قادرة على استيعاب نمو البيانات مستقبلاً."},
{q:"CRM التحليلي يهدف إلى أتمتة العمليات اليومية للواجهة الأمامية.",a:false,e:"أتمتة العمليات اليومية هدف CRM التشغيلي. CRM التحليلي يهدف إلى تحويل البيانات إلى رؤى."},
{q:"CRM يستخدم تحليل البيانات التاريخية لفهم احتياجات العملاء وتوقعاتهم.",a:true,e:"صحيح، CRM يعتمد على تحليل البيانات التاريخية لفهم احتياجات وتوقعات العملاء."},
{q:"تكامل CRM مع TQM يُقلّل من رضا العملاء.",a:false,e:"العكس صحيح، تكامل CRM مع TQM يُحسّن تجربة العميل ويرفع مستوى الرضا والاحتفاظ."},
{q:"يُمكن اعتبار CRM وTQM متعارضَين في أهدافهما.",a:false,e:"CRM وTQM متكاملان لا متعارضان؛ كلاهما يصبّان في تحقيق رضا العميل وتعزيز التنافسية."},
{q:"CRM الاستراتيجي يهدف إلى بناء ثقافة مؤسسية تتمحور حول العميل.",a:true,e:"صحيح، CRM الاستراتيجي يبني ثقافة مؤسسية كاملة تضع العميل في محور اهتمامها."},
{q:"من قواعد نجاح CRM: الاستراتيجية قبل التقنية.",a:true,e:"صحيح، أولى قواعد نجاح CRM هي تحديد الأهداف التجارية (الاستراتيجية) قبل اختيار البرنامج (التقنية)."},
{q:"تكامل CRM مع TQM يُحسّن تجربة العميل من خلال التخصيص.",a:true,e:"صحيح، التخصيص الذي يوفره CRM يُحسّن تجربة العميل وهو أحد أثار تكامل CRM مع TQM."}
],

// ======= STATE =======
const S={lec:0,ans:{},cor:0,tot:0};
const LS=['أ','ب','ج','د'];

function k(t,i){return`${S.lec}_${t}_${i}`;}

function buildTabs(){
  const c=document.getElementById('tabsIn');
  c.innerHTML='';
  Object.keys(D).forEach(n=>{
    const b=document.createElement('button');
    b.className='tb'+(+n===S.lec?' act':'');
    b.textContent=`م${+n+1}`;
    b.title=D[n].title;
    b.onclick=()=>{S.lec=+n;render();};
    c.appendChild(b);
  });
}

function upScore(){
  const t=S.tot,c=S.cor;
  document.getElementById('scNum').textContent=`${c}/${t}`;
  document.getElementById('pbFill').style.width=t?`${Math.round(c/t*100)}%`:'0%';
  const p=t?Math.round(c/t*100):0;
  document.getElementById('pbLbl').textContent=t?`تمت الإجابة على ${t} سؤال من 350`:'ابدأ الإجابة للتتبع تقدمك';
  const pe=document.getElementById('pct');
  pe.textContent=t?`${p}%`:'—';
  pe.style.color=p>=80?'#059669':p>=60?'#d97706':'#dc2626';
}

function getLecProg(){
  const d=D[S.lec];let done=0;
  d.tf.forEach((_,i)=>{if(S.ans[`${S.lec}_tf_${i}`]!==undefined)done++;});
  d.mc.forEach((_,i)=>{if(S.ans[`${S.lec}_mc_${i}`]!==undefined)done++;});
  return{done,total:50};
}

function mkCard(q,idx,type){
  const kk=k(type,idx);
  const ans=S.ans[kk];
  const isAns=ans!==undefined;
  const isOk=isAns&&(type==='tf'?ans===q.a:ans===q.a);
  const card=document.createElement('div');
  card.className='qcard'+(isAns?(isOk?' ok':' no'):'');
  const meta=document.createElement('div');meta.className='qmeta';
  const badge=document.createElement('span');badge.className='qbadge';
  badge.textContent=`${type==='tf'?'ص/خ':'م'} · ${idx+1}`;
  const st=document.createElement('span');st.className='qst'+(isAns?' vis':'');
  st.textContent=isAns?(isOk?'✅':'❌'):'';
  meta.appendChild(badge);meta.appendChild(st);
  card.appendChild(meta);
  const qt=document.createElement('div');qt.className='qtxt';qt.textContent=q.q;
  card.appendChild(qt);
  if(type==='tf'){
    const row=document.createElement('div');row.className='tf-row';
    [true,false].forEach(val=>{
      const b=document.createElement('button');b.className='tf-btn';
      b.innerHTML=val?'<span>✓</span> صحيح':'<span>✗</span> خطأ';
      if(isAns){
        b.disabled=true;
        if(val===q.a)b.classList.add(isOk&&ans===val?'ok':'rv');
        if(val!==q.a&&ans===val)b.classList.add('no');
      }else{
        b.onclick=()=>{
          const ok=val===q.a;S.ans[kk]=val;S.tot++;if(ok)S.cor++;
          upScore();render();
        };
      }
      row.appendChild(b);
    });
    card.appendChild(row);
  }else{
    const opts=document.createElement('div');opts.className='opts';
    q.o.forEach((opt,oi)=>{
      const b=document.createElement('button');b.className='opt-btn';
      const ltr=document.createElement('span');ltr.className='ol';ltr.textContent=LS[oi];
      b.appendChild(ltr);b.appendChild(document.createTextNode(opt));
      if(isAns){
        b.disabled=true;
        if(oi===q.a)b.classList.add(isOk&&ans===oi?'ok':'rv');
        if(oi!==q.a&&ans===oi)b.classList.add('no');
      }else{
        b.onclick=()=>{
          const ok=oi===q.a;S.ans[kk]=oi;S.tot++;if(ok)S.cor++;
          upScore();render();
        };
      }
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }
  if(isAns){
    const fb=document.createElement('div');
    fb.className='fb '+(isOk?'ok':'no');
    fb.textContent=(isOk?'✅ إجابة صحيحة! ':'❌ إجابة خاطئة. ')+q.e;
    card.appendChild(fb);
  }
  return card;
}

function checkResult(mc){
  const d=D[S.lec];let done=0,lc=0;
  d.tf.forEach((q,i)=>{const kk=k('tf',i);if(S.ans[kk]!==undefined){done++;if(S.ans[kk]===q.a)lc++;}});
  d.mc.forEach((q,i)=>{const kk=k('mc',i);if(S.ans[kk]!==undefined){done++;if(S.ans[kk]===q.a)lc++;}});
  if(done===50){
    const p=Math.round(lc/50*100);
    const r=document.createElement('div');r.className='result show';
    let em='🏆',ti='أداء رائع!';
    if(p>=90){em='🌟';ti='ممتاز جداً!';}
    else if(p>=80){em='🏆';ti='أداء رائع!';}
    else if(p>=70){em='👍';ti='جيد جداً!';}
    else if(p>=60){em='📚';ti='جيد — استمر في المراجعة';}
    else{em='💪';ti='راجع المحاضرة مرة أخرى';}
    r.innerHTML=`<div class="re">${em}</div><div class="rt">${ti}</div><div class="rs">${p}%</div><div class="rsub">نتيجة المحاضرة ${S.lec+1}</div><div class="rg"><div class="rstat"><div class="rval">${lc}</div><div class="rlbl">إجابة صحيحة</div></div><div class="rstat"><div class="rval">${50-lc}</div><div class="rlbl">إجابة خاطئة</div></div><div class="rstat"><div class="rval">50</div><div class="rlbl">إجمالي الأسئلة</div></div></div><button class="rbtn" onclick="restartLec()">🔄 إعادة المحاضرة</button>`;
    mc.appendChild(r);
  }
}

function restartLec(){
  const d=D[S.lec];
  d.tf.forEach((q,i)=>{const kk=k('tf',i);if(S.ans[kk]!==undefined){if(S.ans[kk]===q.a)S.cor--;S.tot--;delete S.ans[kk];}});
  d.mc.forEach((q,i)=>{const kk=k('mc',i);if(S.ans[kk]!==undefined){if(S.ans[kk]===q.a)S.cor--;S.tot--;delete S.ans[kk];}});
  render();
}

function render(){
  buildTabs();
  const d=D[S.lec];
  const prog=getLecProgress();
  const mc=document.getElementById('mainC');
  mc.innerHTML='';
  // Lecture header
  const lh=document.createElement('div');lh.className='lec-hd';
  const ln=document.createElement('span');ln.className='lec-n';ln.textContent=`المحاضرة ${S.lec+1}`;
  const lt=document.createElement('span');lt.className='lec-t';lt.textContent=d.title;
  lh.appendChild(ln);lh.appendChild(lt);mc.appendChild(lh);
  // Progress
  const lp=document.createElement('div');lp.className='lp-row';
  const lpb=document.createElement('div');lpb.className='lp-bar';
  const lpi=document.createElement('div');lpi.className='lp-fill';
  lpi.style.width=`${Math.round(prog.done/prog.total*100)}%`;
  lpb.appendChild(lpi);lp.appendChild(lpb);
  const lpt=document.createElement('div');lpt.className='lp-txt';
  lpt.textContent=`${prog.done}/${prog.total} سؤال`;
  lp.appendChild(lpt);mc.appendChild(lp);
  // TF section
  const sh1=document.createElement('div');sh1.className='sec-hd';
  const si1=document.createElement('div');si1.className='sec-ico tf';si1.textContent='✅';
  const st1=document.createElement('div');st1.className='sec-t';
  st1.innerHTML='<h2>القسم الأول: صح وخطأ</h2><p>25 سؤال — اختر صح أو خطأ</p>';
  sh1.appendChild(si1);sh1.appendChild(st1);mc.appendChild(sh1);
  d.tf.forEach((q,i)=>mc.appendChild(mkCard(q,i,'tf')));
  // MC section
  const sh2=document.createElement('div');sh2.className='sec-hd';
  const si2=document.createElement('div');si2.className='sec-ico mc';si2.textContent='🎯';
  const st2=document.createElement('div');st2.className='sec-t';
  st2.innerHTML='<h2>القسم الثاني: اختيار من متعدد</h2><p>25 سؤال — اختر الإجابة الصحيحة</p>';
  sh2.appendChild(si2);sh2.appendChild(st2);mc.appendChild(sh2);
  d.mc.forEach((q,i)=>mc.appendChild(mkCard(q,i,'mc')));
  checkResult(mc);
  upScore();
}

function getLecProgress(){
  const d=D[S.lec];let done=0;
  d.tf.forEach((_,i)=>{if(S.ans[`${S.lec}_tf_${i}`]!==undefined)done++;});
  d.mc.forEach((_,i)=>{if(S.ans[`${S.lec}_mc_${i}`]!==undefined)done++;});
  return{done,total:50};
}

render();
</script>
</body>
