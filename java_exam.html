<head>

<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#16213a;--mut:#5b6785;--line:#dde2ee;--pri:#1f4e8c;--pri2:#e8f0fb;--ok:#16794c;--okbg:#e3f6ec;--bad:#b3261e;--badbg:#fdeceb;--acc:#d98a00}
@media(prefers-color-scheme:dark){:root{--bg:#0d1424;--card:#151e33;--ink:#e8edf8;--mut:#9aa7c7;--line:#2a3654;--pri:#6ea8ff;--pri2:#1b2a49;--ok:#5fd39b;--okbg:#10301f;--bad:#ff8a80;--badbg:#3a1613;--acc:#ffc247}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header h1{margin:6px 0 2px;font-size:1.5rem}
header p{margin:0 0 12px;color:var(--mut);font-size:.95rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab{flex:1;min-width:150px;padding:10px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media(prefers-color-scheme:dark){.tab.on{color:#0d1424}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.chips span{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--pri2);margin-inline-start:6px;font-weight:700}
.chips .g{color:var(--ok)}.chips .r{color:var(--bad)}
.q{font-size:1.15rem;font-weight:700;margin:10px 0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;cursor:pointer;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri2)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:12px;padding:14px;border-radius:12px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b.t{display:block;margin-bottom:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{padding:9px 16px;border-radius:10px;border:1.5px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#0d1424}}
.btn.s{background:transparent;color:var(--pri)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;margin-top:10px}
.grid button{padding:4px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;font-size:.8rem;cursor:pointer}
.grid button.cur{outline:2px solid var(--pri)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
code{direction:ltr;unicode-bidi:isolate;font-family:Consolas,Menlo,monospace;background:rgba(127,127,127,.18);padding:1px 6px;border-radius:5px;font-size:.92em}
pre{direction:ltr;text-align:left;background:#0f1b33;color:#e6edf7;padding:14px;border-radius:10px;overflow:auto;font-size:.88rem;line-height:1.6}
pre code{background:none;padding:0}
.score{text-align:center}
.score .big{font-size:3rem;font-weight:800;color:var(--pri)}
details{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--card)}
summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1.05rem}
.ans{padding:0 16px 16px}
.ans h4{margin:14px 0 4px;color:var(--pri)}
.ans table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92rem}
.ans th,.ans td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.ans th{background:var(--pri2)}
.note{background:var(--pri2);border-radius:10px;padding:10px 14px;font-size:.9rem;color:var(--mut)}
.credit{text-align:center;background:linear-gradient(135deg,var(--pri2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px 12px;margin:4px 0 12px}.credit .by{font-size:1.25rem;font-weight:800;color:var(--pri)}.credit .sub{margin-top:2px;color:var(--mut);font-size:1rem}
footer{text-align:center;color:var(--mut);font-size:.85rem;margin:20px 0}
</style>
</head>

{t:"1) الفرق بين حلقتي for و while مع مثال على كل منهما",
 n:"الحلقات من تراكيب التكرار (Iteration) التي ذُكرت في المحاضرة الثالثة، أما تفاصيل for وwhile فمن أساسيات Java العامة.",
 h:`
<h4>التعريف</h4>
<p>كلتاهما حلقة تكرار (Iteration) تُنفِّذ مجموعة تعليمات بشكل متكرر <b>طالما تحقق شرط معين</b>.</p>
<h4>حلقة for</h4>
<p>تُستخدم عندما يكون <b>عدد مرات التكرار معروفًا مسبقًا</b>، وتجمع الابتداء والشرط والتحديث في سطر واحد.</p>
<pre><code>for (initialization; condition; update) {
    statements;
}

// مثال: مجموع الأعداد من 1 إلى 5
int sum = 0;
for (int i = 1; i &lt;= 5; i++) {
    sum += i;
}
System.out.println("Sum = " + sum);   // Sum = 15</code></pre>
<h4>حلقة while</h4>
<p>تُستخدم عندما يكون <b>عدد التكرارات غير معروف</b> ويعتمد على شرط يتغير أثناء التشغيل، وتفحص الشرط قبل كل تكرار.</p>
<pre><code>while (condition) {
    statements;   // يجب تغيير ما يؤثر في الشرط
}

// مثال: قراءة أعداد حتى إدخال 0
Scanner input = new Scanner(System.in);
int sum = 0;
int n = input.nextInt();
while (n != 0) {
    sum += n;
    n = input.nextInt();
}
System.out.println("Sum = " + sum);</code></pre>
<h4>جدول المقارنة</h4>
<table>
<tr><th>وجه المقارنة</th><th>for</th><th>while</th></tr>
<tr><td>الاستخدام الأنسب</td><td>عدد التكرارات معلوم</td><td>عدد التكرارات غير معلوم</td></tr>
<tr><td>موضع الابتداء والتحديث</td><td>داخل رأس الحلقة</td><td>يُكتبان يدويًا قبل الحلقة وداخلها</td></tr>
<tr><td>خطر الحلقة اللانهائية</td><td>أقل</td><td>أعلى عند نسيان تحديث المتغير</td></tr>
<tr><td>الشرط</td><td>يُفحص قبل كل تكرار</td><td>يُفحص قبل كل تكرار</td></tr>
</table>
<p class="note">ملاحظة: توجد أيضًا حلقة <code>do-while</code> وتُنفَّذ مرة واحدة على الأقل لأن الشرط يُفحص بعد التنفيذ.</p>`},

{t:"3) تعريف المصفوفة (Array)",
 n:"المصفوفات لم تُشرح تفصيليًا في المحاضرات الأربع (ورد فقط String[] args)، والإجابة من أساسيات Java.",
 h:`
<h4>التعريف</h4>
<p>المصفوفة <b>بنية بيانات تخزن عددًا ثابتًا من القيم من نفس النوع</b> في مواقع متجاورة بالذاكرة، ويُوصل لكل عنصر بواسطة <b>فهرس (Index)</b> يبدأ من <b>0</b>.</p>
<h4>الخصائص</h4>
<ul>
<li>جميع العناصر من نوع واحد.</li>
<li>حجمها يُحدد عند إنشائها ولا يتغير بعد ذلك.</li>
<li>أول فهرس 0 وآخر فهرس <code>length - 1</code>.</li>
<li>الوصول إلى فهرس خارج النطاق يسبب <code>ArrayIndexOutOfBoundsException</code>.</li>
</ul>
<h4>مثال</h4>
<pre><code>// تعريف وإنشاء
int[] marks = new int[3];
marks[0] = 80;
marks[1] = 90;
marks[2] = 75;

// أو بالقيم مباشرة
int[] grades = {80, 90, 75};

// الطباعة والمرور على العناصر
for (int i = 0; i &lt; grades.length; i++) {
    System.out.println(grades[i]);
}</code></pre>
<h4>الاستخدام</h4>
<p>تخزين مجموعة من القيم المتشابهة مثل درجات الطلاب بدلًا من تعريف متغير منفصل لكل قيمة.</p>`},

  let items;
  if(onlyWrong&&old){
    items=old.items.filter(x=>x.a!==null&&x.a!==x.c).map(x=>({...x,a:null}));
  }else if(m==='tf'){
    items=TF.map(q=>({q:q[0],opts:['صح','خطأ'],c:q[1]?0:1,e:q[2],a:null}));
  }else{
    items=MC.map(q=>{const o=shuffle([q[1],q[2],q[3],q[4]].map((t,j)=>({t,ok:j===0})));return {q:q[0],opts:o.map(x=>x.t),c:o.findIndex(x=>x.ok),e:q[5],a:null};});
  }
  if(doShuffle)shuffle(items);
  S[m]={items,i:0};
  S.view[m]='q';
}
function cur(){const s=S[mode];return s.items[s.i];}
function stats(m){const it=S[m].items;let r=0,w=0;it.forEach(x=>{if(x.a!==null){x.a===x.c?r++:w++;}});return{r,w,t:it.length,u:it.length-r-w};}

function tabs(){
  document.getElementById('tabs').innerHTML=['tf','mc','essay'].map(m=>`<button class="tab ${m===mode?'on':''}" onclick="setMode('${m}')">${NAMES[m]}</button>`).join('');
}
function setMode(m){mode=m;render();window.scrollTo(0,0);}

function render(){
  tabs();
  const app=document.getElementById('app');
  if(mode==='essay'){app.innerHTML=essayHTML();return;}
  const s=S[mode];
  if(S.view[mode]==='r'){app.innerHTML=resultHTML();return;}
  const it=s.items[s.i];
  const st=stats(mode);
  const pct=Math.round((s.i+1)/s.items.length*100);
  let opts=it.opts.map((t,j)=>{
    let cls='';
    if(it.a!==null){if(j===it.c)cls='ok';else if(j===it.a)cls='bad';}
    const key=mode==='tf'?(j===0?'✓':'✗'):'أبجد'.split('')[j];
    return `<button class="opt ${cls}" ${it.a!==null?'disabled':''} onclick="pick(${j})"><span class="k">${key}</span><span>${esc(t)}</span></button>`;
  }).join('');
  let fb='';
  if(it.a!==null){
    const good=it.a===it.c;
    fb=`<div class="fb ${good?'ok':'bad'}"><b class="t">${good?'✅ إجابتك صحيحة':'❌ إجابتك خاطئة'}</b>`+
       (good?'':`الإجابة الصحيحة: <b>${esc(it.opts[it.c])}</b><br>`)+
       `<b>الشرح:</b> ${esc(it.e)}</div>`;
  }
  const grid=s.items.map((x,k)=>{let c='';if(x.a!==null)c=x.a===x.c?'ok':'bad';if(k===s.i)c+=' cur';return `<button class="${c}" onclick="go(${k})">${k+1}</button>`;}).join('');
  app.innerHTML=`
  <div class="card">
    <div class="meta"><span>السؤال ${s.i+1} من ${s.items.length}</span>
      <span class="chips"><span class="g">صحيح ${st.r}</span><span class="r">خطأ ${st.w}</span><span>متبقٍ ${st.u}</span></span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="q">${esc(it.q)}</div>
    ${opts}${fb}
    <div class="nav">
      <button class="btn s" onclick="go(S[mode].i-1)" ${s.i===0?'disabled':''}>→ السابق</button>
      <button class="btn" onclick="go(S[mode].i+1)" ${s.i===s.items.length-1?'disabled':''}>التالي ←</button>
      <button class="btn s" onclick="showResult()">عرض النتيجة</button>
      <button class="btn s" onclick="reset(true)">إعادة وخلط الأسئلة</button>
    </div>
  </div>
  <div class="card"><b>خريطة الأسئلة</b><div class="grid">${grid}</div></div>`;
}
function pick(j){const it=cur();if(it.a!==null)return;it.a=j;render();}
function go(k){const s=S[mode];if(k<0||k>=s.items.length)return;s.i=k;render();}
function showResult(){S.view[mode]='r';render();window.scrollTo(0,0);}
function reset(sh){build(mode,sh,false);render();}
function retryWrong(){const st=stats(mode);if(!st.w){return;}build(mode,false,true);render();}
function resultHTML(){
  const st=stats(mode);const done=st.t-st.u;
  const pct=done?Math.round(st.r/st.t*100):0;
  const msg=pct>=85?'ممتاز! مستواك رائع 🌟':pct>=65?'جيد، راجع الأسئلة الخاطئة لتصل للامتياز':pct>=50?'مقبول، تحتاج لمراجعة المحاضرات':'تحتاج لمراجعة المحاضرات ثم أعد المحاولة';
  return `<div class="card score"><div>نتيجتك في قسم «${NAMES[mode]}»</div>
  <div class="big">${st.r} / ${st.t}</div><div>${pct}%</div><p>${done?msg:'لم تجب عن أي سؤال بعد.'}</p>
  <p class="chips"><span class="g">صحيح ${st.r}</span><span class="r">خطأ ${st.w}</span><span>لم يُجَب ${st.u}</span></p>
  <div class="nav" style="justify-content:center">
   <button class="btn" onclick="S.view[mode]='q';render()">العودة للأسئلة</button>
   <button class="btn s" onclick="retryWrong()" ${st.w?'':'disabled'}>إعادة الأسئلة الخاطئة فقط</button>
   <button class="btn s" onclick="reset(true)">اختبار جديد (خلط)</button>
  </div></div>`;
}
function essayHTML(){
  return `<div class="card"><b>الأسئلة المقالية مع الإجابات النموذجية</b>
  <p class="note">اضغط على كل سؤال لعرض الإجابة النموذجية. حاول أن تجيب بنفسك أولًا ثم قارن.</p></div>`+
  ESSAY.map(e=>`<details><summary>${e.t}</summary><div class="ans"><p class="note">${e.n}</p>${e.h}</div></details>`).join('');
}
document.addEventListener('keydown',e=>{
  if(mode==='essay'||S.view[mode]!=='q')return;
  if(e.key==='ArrowLeft')go(S[mode].i+1);
  else if(e.key==='ArrowRight')go(S[mode].i-1);
  else if(/^[1-4]$/.test(e.key)){const j=+e.key-1;if(j<cur().opts.length)pick(j);}
});
build('tf',false);build('mc',false);render();
</script>
</body>
</html>
