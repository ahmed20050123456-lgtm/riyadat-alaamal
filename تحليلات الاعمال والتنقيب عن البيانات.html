<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>امتحان تحليلات الأعمال والتنقيب في البيانات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1b2e; --bg2:#10304a; --card:#fff; --ink:#14263a; --muted:#5c6f82;
  --gold:#d9a441; --teal:#17a2a0; --ok:#1e9e5a; --okbg:#e6f7ee; --bad:#d64545; --badbg:#fdecec; --line:#dfe7ee;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
header{text-align:center;padding:38px 16px 26px;color:#fff}
.credit{display:inline-block;font-size:clamp(24px,5vw,40px);font-weight:900;background:linear-gradient(90deg,#f6d98a,#d9a441,#f6d98a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.smile{font-size:clamp(28px,6vw,44px);display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.quote{margin:10px auto 0;max-width:720px;font-size:clamp(16px,3.4vw,22px);font-weight:600;color:#cfe8ee}
.title{margin:22px 0 4px;font-size:clamp(20px,4vw,28px);font-weight:700}
.sub{color:#9fb7c6;font-size:14px}
.bar{position:sticky;top:0;z-index:10;background:rgba(11,27,46,.96);backdrop-filter:blur(6px);border-bottom:1px solid #2a4660;padding:10px 12px}
.bar-in{max-width:900px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;color:#fff;font-size:14px}
.pill{background:#18364f;border-radius:20px;padding:4px 12px}
.pill b{color:var(--gold)}
.prog{flex-basis:100%;height:6px;background:#1d3b55;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s}
.tabs{max-width:900px;margin:18px auto 0;display:flex;gap:8px;padding:0 12px;flex-wrap:wrap}
.tab{flex:1;min-width:140px;border:0;cursor:pointer;font:inherit;font-weight:700;padding:12px;border-radius:12px;background:#18364f;color:#cfe8ee;transition:.2s}
.tab.on{background:var(--gold);color:#2a1d00}
main{max-width:900px;margin:16px auto 60px;padding:0 12px}
.sec{display:none}.sec.on{display:block}
.q{background:var(--card);border-radius:16px;padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);border-right:6px solid var(--line)}
.q.good{border-right-color:var(--ok)}.q.wrong{border-right-color:var(--bad)}
.qn{font-size:13px;color:var(--teal);font-weight:700;margin-bottom:4px}
.qt{font-size:18px;font-weight:700;line-height:1.7;margin-bottom:12px}
.opts{display:grid;gap:8px}
.tf{grid-template-columns:1fr 1fr}
.opt{font:inherit;text-align:right;cursor:pointer;background:#f4f8fb;border:2px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink);font-weight:600;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);background:#eaf7f7;transform:translateX(-2px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);color:#0d5c33}
.opt.miss{background:var(--badbg);border-color:var(--bad);color:#8e2020}
.opt .l{display:inline-block;min-width:26px;color:var(--teal);font-weight:900}
.fb{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:15.5px;line-height:1.8}
.fb.show{display:block;animation:fade .3s}
.fb.good{background:var(--okbg);color:#0d5c33}.fb.wrong{background:var(--badbg);color:#7a1d1d}
.fb strong{display:block;margin-bottom:2px}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
textarea{width:100%;min-height:110px;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--teal)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--teal);color:#fff;margin-top:10px}
.btn.gold{background:var(--gold);color:#2a1d00}
.model{display:none;margin-top:12px;background:#fff8e6;border:2px dashed var(--gold);border-radius:12px;padding:12px 14px;line-height:1.9;white-space:pre-line}
.model.show{display:block;animation:fade .3s}
.model h4{margin:0 0 6px;color:#8a5d00}
.actions{text-align:center;margin:24px 0}
.result{display:none;background:#fff;border-radius:20px;padding:26px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);margin-bottom:20px}
.result.show{display:block;animation:fade .4s}
.big{font-size:56px;font-weight:900;color:var(--teal);margin:0}
.foot{text-align:center;color:#8fa9bb;font-size:13px;padding-bottom:30px}
@media(max-width:520px){.tf{grid-template-columns:1fr}.qt{font-size:16.5px}}
</style>
</head>
<body>
<header>
  <h1 class="credit">تصميم أحمد حسين ابراهيم</h1> <span class="smile">😊</span>
  <p class="quote">الخازوق اللي مقدرتش تتجنبه، استمتع بيه ومتصفّيش النية 😉</p>
  <div class="title">امتحان تحليلات الأعمال والتنقيب في البيانات</div>
  <div class="sub">100 سؤال (50 صح/خطأ + 50 اختيار من متعدد) + 10 أسئلة مقالية — من محتوى المحاضرات</div>
</header>

<div class="bar"><div class="bar-in">
  <span class="pill">تمت الإجابة: <b id="sAns">0</b> / 100</span>
  <span class="pill">✅ صحيحة: <b id="sOk">0</b></span>
  <span class="pill">❌ خاطئة: <b id="sBad">0</b></span>
  <div class="prog"><i id="pg"></i></div>
</div></div>

<div class="tabs">
  <button class="tab on" data-t="tf">صح وخطأ (50)</button>
  <button class="tab" data-t="mc">اختيار من متعدد (50)</button>
  <button class="tab" data-t="es">أسئلة مقالية (10)</button>
</div>

<main>
  <div class="result" id="result"></div>
  <section class="sec on" id="tf"></section>
  <section class="sec" id="mc"></section>
  <section class="sec" id="es"></section>
  <div class="actions">
    <button class="btn gold" id="finish">🏁 إنهاء الامتحان وعرض النتيجة</button>
    <button class="btn" id="restart">🔄 إعادة الامتحان (خلط الاختيارات)</button>
  </div>
  <div class="foot">تصميم أحمد حسين ابراهيم 😊 — بالتوفيق يا بطل</div>
</main>

<script>
/* ===== صح / خطأ : [السؤال, الإجابة(true/false), الشرح] ===== */
const TF = [
["الصف (Row) في جدول البيانات أو الـ DataFrame يمثل عادةً سجلاً أو معاملة فردية واحدة.",true,"صحيح. كل صف = سجل أو معاملة تجارية واحدة (Record / Transaction)."],
["كل عمود (Column) في الـ DataFrame يمثل متغيراً أو ميزة أو مؤشراً تشغيلياً (Feature/KPI).",true,"صحيح. الأعمدة هي المتغيرات أو السمات، والصفوف هي السجلات."],
["التعلم العميق (Deep Learning) هو المظلة الأوسع التي تشمل تعلم الآلة والذكاء الاصطناعي.",false,"خطأ. الترتيب الصحيح: الذكاء الاصطناعي (الأوسع) ثم تعلم الآلة ثم التعلم العميق (الأضيق)."],
["توليد النماذج التوليدية لنصوص بليغة ومتماسكة يضمن بصورة قاطعة صحة المعلومات الواردة فيها.",false,"خطأ. النماذج التوليدية قد تنتج معلومات خاطئة (هلوسة) بصياغة مقنعة، لذا يجب التحقق من الحقائق."],
["تتكون بيانات التدريب في التعلم الخاضع للإشراف من سمات المدخلات مقرونة بالقيمة الحقيقية المستهدفة (بيانات معنونة).",true,"صحيح. التعلم الخاضع للإشراف يعتمد على Labeled Data."],
["يعتمد التعلم غير الخاضع للإشراف على بيانات معنونة تحتوي مسبقاً على قيمة الهدف لكل معاملة.",false,"خطأ. هذا وصف التعلم الخاضع للإشراف؛ أما غير الخاضع فيعمل على بيانات غير معنونة."],
["كشف الرسائل الاحتيالية (Spam) والموافقة على القروض الائتمانية مثالان على مهام الانحدار.",false,"خطأ. هذه مهام تصنيف (Classification) لأن المخرجات فئات وليست قيماً رقمية متصلة."],
["توفر منصات Kaggle و Google Colab بيئات عمل فورية تتيح وحدات معالجة رسومية (GPUs) مجانية.",true,"صحيح. وهي من أبرز البيئات السحابية لتعلم الآلة."],
["تعتمد الأنظمة القائمة على القواعد (Rule-based) على منطق صريح يكتب يدوياً بصيغ شرطية مثل If-Else.",true,"صحيح. بعكس تعلم الآلة الذي يكتشف العلاقات تلقائياً من البيانات."],
["فصل المتغير المستهدف (y) عن سمات المدخلات (X) قبل التدريب يهدف لمنع تسريب الإجابة للنموذج (Data Leakage).",true,"صحيح. حتى يمكن تقييم قدرة النموذج على التنبؤ الحقيقي عند تمرير بيانات جديدة."],
["التنبؤ بأسعار العقارات أو حجم المبيعات يمثل مهمة انحدار (Regression).",true,"صحيح. لأن الناتج قيمة رقمية متصلة ومستمرة."],
["التجميع العنقودي (Clustering) مثال على التعلم الخاضع للإشراف.",false,"خطأ. التجميع العنقودي مثال على التعلم غير الخاضع للإشراف لأنه يعمل على بيانات غير معنونة."],
["أنظمة استرجاع البيانات (Data Retrieval) تعطي إجابة احتمالية وغير مباشرة.",false,"خطأ. استرجاع البيانات إجابته مباشرة وحتمية (Deterministic)، والاحتمالية صفة استرجاع المعلومات."],
["يُقاس نجاح أنظمة استرجاع المعلومات (Information Retrieval) بمدى الملائمة (Relevance) لاحتياجات المستفيد.",true,"صحيح. أما استرجاع البيانات فيقاس بدقة وصحة البيانات المرجعة."],
["يعد كالفن موورز (Calvin Mooers) عام 1950 بداية التأصيل العلمي لمصطلح استرجاع المعلومات.",true,"صحيح. عرّف «بحث واسترجاع المعلومات» بأنه العملية التي تعقب اختزان المعلومات لاستعادتها عند الحاجة."],
["الأسلوب التقليدي (اليدوي) في خزن المعلومات يعتمد على الأنظمة الآلية وقواعد البيانات.",false,"خطأ. الأسلوب التقليدي يعتمد على التنظيم الورقي والفهارس التقليدية، أما الآلي فيعتمد على قواعد البيانات."],
["يتراوح التحويل الإلكتروني للوثائق في الأنظمة الرقمية بين 300 و600 نقطة في البوصة (DPI) بالألوان.",true,"صحيح. وذلك ضمن مرحلة تكامل وتحويل البيانات مع استخدام المسح الضوئي وOCR."],
["تقنية OCR تُستخدم للتعرف الضوئي على الحروف أثناء المسح الضوئي للوثائق.",true,"صحيح. OCR = Optical Character Recognition."],
["في أنظمة استرجاع البيانات يتم الوصول عبر واصفات متعددة (المؤلف، العنوان، الموضوع، التاريخ).",false,"خطأ. تعدد الواصفات من خصائص استرجاع المعلومات، أما استرجاع البيانات ففيه نقطة وصول واحدة وفريدة."],
["البحث الموضوعي الشامل هو الحاجة للوصول إلى وثيقة معينة بذاتها عن طريق اسم المؤلف أو العنوان.",false,"خطأ. هذا هو البحث المحدد (الخاص). أما الموضوعي الشامل فهو الوصول لجميع الوثائق المتعلقة بموضوع معين."],
["تهدف نظم دعم القرار أساساً للتصدي للمشكلات في المواقف شبه الهيكلية (Semi-structured).",true,"صحيح. وتستخدم نماذج كمية وتحليلية عبر واجهة تفاعلية سهلة الاستخدام."],
["تعتمد عملية اتخاذ القرار على ست خطوات متتابعة ومترابطة.",false,"خطأ. هي خمس خطوات: تحديد الأهداف، تحديد معايير القياس، تحديد البدائل، تقييم البدائل، اختيار البديل الأمثل."],
["تجمع نظم دعم القرار بياناتها من نظم معالجة المعاملات (TPS) والمعلومات الإدارية (MIS) والموارد الخارجية.",true,"صحيح. فهي لا تعتمد على مصدر واحد."],
["نظم دعم القرارات الجماعية (GDSS) تتعامل مع مستخدم واحد يتخذ القرار بمفرده.",false,"خطأ. هذا وصف النظم الفردية؛ أما GDSS فتخدم مجموعة من الأفراد يعملون كفريق واحد."],
["من سلبيات نظم دعم القرارات الجماعية احتمال نشوب صراعات بين المساهمين لاختلاف وجهات النظر.",true,"صحيح. لأن لكل فرد وجهة نظر نابعة من القسم الذي يعمل به."],
["يتكون نظام دعم القرار من ثلاثة نظم فرعية فقط.",false,"خطأ. يتكون من أربعة نظم فرعية: إدارة البيانات، إدارة النماذج، إدارة المعرفة، وواجهة المستخدم."],
["النماذج الاستراتيجية يستخدمها مديرو الإدارات التشغيلية لمعالجة أوامر العمل اليومية.",false,"خطأ. الاستراتيجية للإدارة العليا (مثل التخطيط)، أما التشغيلية فلمديري الإدارات التشغيلية."],
["في تحليل الحساسية (Sensitivity Analysis) يتم تغيير قيمة متغير واحد فقط بصورة متكررة لملاحظة أثره على باقي المتغيرات.",true,"صحيح. أما تحليل «ما إذا» فيغير المتغيرات أو العلاقات بينها."],
["في تحليل البحث عن الهدف (Goal-Seeking) تُعدّل قيم المتغيرات الأخرى تلقائياً حتى الوصول إلى القيمة الموضوعة كهدف.",true,"صحيح. توضع قيمة معينة كهدف لمتغير محدد ويُعدّل الباقي تلقائياً."],
["غياب سهولة استخدام واجهة المستخدم لا يؤثر على استخدام النظام طالما كانت الإجراءات التحليلية جيدة.",false,"خطأ. عدم مناسبة الواجهة يؤدي مباشرة إلى عدم استخدام النظام مهما كانت جودة التحليلات."],
["مصطلح التنقيب لأسفل (Drill-Down) يعبر عن احتياج المدير إلى معلومات أكثر تفصيلاً عند الانتقال لمستوى أقل في النظام.",true,"صحيح. وهو مصطلح مستخدم في نظم الدعم التنفيذية."],
["نظم الدعم التنفيذية (ESS/EIS) تخدم مديري المستوى التشغيلي فقط.",false,"خطأ. تخدم الإدارة التنفيذية العليا وتوفر الوصول السريع للمعلومات الموقوتة والدقيقة."],
["نظم المعلومات الجغرافية (GIS) قادرة على تحليل وعرض البيانات باستخدام الخرائط الرقمية.",true,"صحيح. وذلك لتحسين عمليات التخطيط واتخاذ القرار."],
["التنقيب عن البيانات هو مرحلة جوهرية ضمن عملية أوسع تسمى استكشاف المعرفة في قواعد البيانات (KDD).",true,"صحيح. التنقيب ليس عملية معزولة بل جزء من KDD."],
["ظهر مصطلح التنقيب عن البيانات في منتصف التسعينات بالولايات المتحدة الأمريكية.",true,"صحيح. وهو مجال متداخل يجمع الإحصاء وقواعد البيانات والذكاء الاصطناعي وتعلم الآلة."],
["لا علاقة للإحصاء بمجال التنقيب عن البيانات.",false,"خطأ. التنقيب مجال متداخل يجمع الإحصاء وتكنولوجيا الإعلام وقواعد البيانات والذكاء الاصطناعي وتعلم الآلة."],
["انخفاض تكاليف الاتصالات الإلكترونية يُعد من عوامل جانب العرض لثورة التنقيب.",true,"صحيح. إضافة إلى تطور التخزين والمعالجة وظهور أساليب تحليلية حديثة."],
["تزايد حاجة المؤسسات إلى نتائج تحليلية فورية بسبب شدة المنافسة يُعد من عوامل جانب الطلب.",true,"صحيح. من عوامل الطلب أيضاً انحسار التنظيم الهرمي وازدهار حركات التأليف والنشر."],
["النماذج التنبؤية في التنقيب تهدف إلى تجميع الأفراد والأحداث في عناقيد.",false,"خطأ. هذا دور النماذج الوصفية؛ أما التنبؤية فتتنبأ بقيمة خصائص معينة في المستقبل."],
["تستخدم أداة التلخيص مقاييس النزعة المركزية (الوسط، الوسيط، المنوال) ومقاييس التشتت كالانحراف المعياري.",true,"صحيح. لكنها قد تهمل تفاصيل دقيقة مهمة عن سلوك المستهلك."],
["تحليل سلة السوق (Market Basket Analysis) تطبيق عملي لأداة التصنيف.",false,"خطأ. هو تطبيق لتحليل الارتباط (Association Rule Analysis) لربط أنماط الشراء."],
["في أداة التنبؤ يكون المتغير التابع المتنبأ به متغيراً كمياً يعبر عن قيم أو سلوكيات مستقبلية.",true,"صحيح. وهذا ما يميزه عن التصنيف."],
["تتكون عملية التنقيب في البيانات من أربع مراحل فقط.",false,"خطأ. تتكون من ست مراحل: فهم الأعمال، فهم البيانات، تهيئة البيانات، صياغة النماذج، التقييم والتحليل، ونشر النموذج."],
["المطلب الأول لاكتشاف المعرفة هو فهم المشاكل والمسائل التي تواجهها الأعمال في المنظمة.",true,"صحيح. وهذا هو هدف مرحلة فهم طبيعة الأعمال."],
["تتطلب مرحلة فهم البيانات بالضرورة تجميع البيانات في مستودع بيانات.",false,"خطأ. لا تتطلب ذلك بالضرورة؛ وإذا كان المستودع موجوداً فالأفضل عدم استخدامه مباشرة لغرض التنقيب."],

/* ===== الكود ===== */
const $ = s => document.querySelector(s);
let answered = 0, okCount = 0, badCount = 0, done = {};

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function updateStats(){
  $('#sAns').textContent = answered; $('#sOk').textContent = okCount; $('#sBad').textContent = badCount;
  $('#pg').style.width = answered + '%';
}

function record(card, correct, fb){
  card.classList.add(correct ? 'good' : 'wrong');
  fb.classList.add('show', correct ? 'good' : 'wrong');
  answered++; correct ? okCount++ : badCount++;
  updateStats();
}

function buildTF(){
  const box = $('#tf'); box.innerHTML = '';
  TF.forEach((it, i) => {
    const card = document.createElement('div'); card.className = 'q';
    card.innerHTML = '<div class="qn">سؤال ' + (i+1) + ' من 50 — صح أم خطأ؟</div><div class="qt"></div>' +
      '<div class="opts tf"><button class="opt" data-v="true">✅ صح</button><button class="opt" data-v="false">❌ خطأ</button></div><div class="fb"></div>';
    card.querySelector('.qt').textContent = it[0];
    const btns = card.querySelectorAll('.opt'), fb = card.querySelector('.fb');
    btns.forEach(b => b.onclick = () => {
      const pick = b.dataset.v === 'true';
      const correct = pick === it[1];
      btns.forEach(x => { x.disabled = true; if ((x.dataset.v === 'true') === it[1]) x.classList.add('right'); });
      if (!correct) b.classList.add('miss');
      fb.innerHTML = '<strong>' + (correct ? '🎉 إجابة صحيحة!' : '😅 إجابة خاطئة — الصحيح: ' + (it[1] ? 'صح' : 'خطأ')) + '</strong>' + it[2];
      record(card, correct, fb);
    });
    box.appendChild(card);
  });
}

function buildMC(){
  const box = $('#mc'); box.innerHTML = '';
  const letters = ['أ','ب','ج','د'];
  MC.forEach((it, i) => {
    const opts = shuffle([0,1,2,3].map(k => ({t: it[1+k], ok: k === 0})));
    const card = document.createElement('div'); card.className = 'q';
    card.innerHTML = '<div class="qn">سؤال ' + (i+1) + ' من 50 — اختر الإجابة الصحيحة</div><div class="qt"></div><div class="opts"></div><div class="fb"></div>';
    card.querySelector('.qt').textContent = it[0];
    const wrap = card.querySelector('.opts'), fb = card.querySelector('.fb');
    const btns = opts.map((o, k) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = '<span class="l">' + letters[k] + ')</span> ';
      b.appendChild(document.createTextNode(o.t));
      wrap.appendChild(b); return b;
    });
    btns.forEach((b, k) => b.onclick = () => {
      const correct = opts[k].ok;
      btns.forEach((x, j) => { x.disabled = true; if (opts[j].ok) x.classList.add('right'); });
      if (!correct) b.classList.add('miss');
      fb.innerHTML = '<strong>' + (correct ? '🎉 إجابة صحيحة!' : '😅 إجابة خاطئة — الصحيح مظلل بالأخضر') + '</strong>' + it[5];
      record(card, correct, fb);
    });
    box.appendChild(card);
  });
}

function buildES(){
  const box = $('#es'); box.innerHTML = '';
  ES.forEach((it, i) => {
    const card = document.createElement('div'); card.className = 'q';
    card.innerHTML = '<div class="qn">سؤال مقالي ' + (i+1) + ' من 10</div><div class="qt"></div>' +
      '<textarea placeholder="اكتب إجابتك هنا ثم قارنها بالإجابة النموذجية..."></textarea>' +
      '<button class="btn">👀 اعرض الإجابة النموذجية</button><div class="model"><h4>✍️ الإجابة النموذجية</h4><div class="mt"></div></div>';
    card.querySelector('.qt').textContent = it[0];
    card.querySelector('.mt').textContent = it[1];
    const m = card.querySelector('.model'), b = card.querySelector('.btn');
    b.onclick = () => { m.classList.toggle('show'); b.textContent = m.classList.contains('show') ? '🙈 إخفاء الإجابة' : '👀 اعرض الإجابة النموذجية'; };
    box.appendChild(card);
  });
}

function reset(){
  answered = okCount = badCount = 0; updateStats();
  $('#result').classList.remove('show');
  buildTF(); buildMC(); buildES();
  window.scrollTo({top:0, behavior:'smooth'});
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on');
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('on')); $('#' + t.dataset.t).classList.add('on');
});

$('#restart').onclick = () => { if (answered === 0 || confirm('هل تريد إعادة الامتحان من البداية؟')) reset(); };

$('#finish').onclick = () => {
  const pct = Math.round(okCount / 100 * 100);
  let msg, emo;
  if (answered === 0) { msg = 'لسه ما جاوبتش على حاجة يا بطل!'; emo = '🤔'; }
  else if (pct >= 90) { msg = 'ممتاز جداً! أنت جاهز تماماً'; emo = '🏆'; }
  else if (pct >= 75) { msg = 'جيد جداً، شوية مراجعة وتبقى فل'; emo = '😎'; }
  else if (pct >= 50) { msg = 'مستوى كويس، راجع الأسئلة الخاطئة'; emo = '💪'; }
  else { msg = 'محتاج مراجعة أكتر للمحاضرات، بالتوفيق'; emo = '📚'; }
  const r = $('#result');
  r.innerHTML = '<div style="font-size:48px">' + emo + '</div><p class="big">' + pct + '%</p>' +
    '<p><b>' + msg + '</b></p><p>صحيحة: ' + okCount + ' | خاطئة: ' + badCount + ' | لم تُجب: ' + (100 - answered) + ' (من 100 سؤال موضوعي)</p>' +
    '<p style="color:#5c6f82">لا تنسَ تجربة الأسئلة المقالية العشرة ومقارنتها بالإجابات النموذجية 😉</p>';
  r.classList.add('show'); window.scrollTo({top:0, behavior:'smooth'});
};

reset();
</script>
